<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عرض المعلمة | مغامرة حديقة لغتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#1e5948;--leaf:#32846c;--cream:#f5f8f1;--line:#d8e8de;--text:#253c33;--gold:#c99237}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top left,#edf8df,#fbfaf4 55%,#e7f2ec);color:var(--text);font-family:Tajawal,Tahoma,sans-serif}
button,a{font:inherit}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid #e2b44f;outline-offset:3px}
.wrap{max-width:1480px;margin:auto;padding:12px 19px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 17px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #1d5b3910;flex-wrap:wrap}
.logo{display:flex;gap:12px;align-items:center}.logo .em{background:#e6f3e7;border-radius:17px;padding:9px;font-size:32px}.logo strong{display:block;color:var(--pine);font-size:24px}.logo small{font-size:14px;color:#7a8f82}
button.pill{border:1px solid #cfe2d2;background:white;color:#326754;border-radius:30px;padding:9px 13px;font-weight:800;font-size:15px}.pill:hover{background:#edf8ec}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.teams{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:11px 0;border:1px solid #cde2d4;background:#eaf5ed;border-radius:18px;padding:10px}
.teams .prompt{font-weight:800;font-size:14px;color:#406c52}.teams .group{display:flex;align-items:center;gap:7px;border:1px solid #d1e4d5;border-radius:13px;padding:5px 9px;background:white;font-weight:800}.teams .group b{color:#9c702e}.teams .group button{border-radius:9px;background:var(--pine);color:white;width:30px;height:30px;font-size:22px;line-height:1}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:15px}.index{max-height:75vh;overflow:auto;border-radius:22px;border:1px solid var(--line);background:#fff;padding:13px}
.index h3{font-size:16px;color:var(--pine);padding:5px 8px;margin:0 0 7px}.index button{display:block;width:100%;background:transparent;text-align:right;border-radius:11px;padding:10px;font-size:14px;color:#667c70;line-height:1.4}
.index button.active{background:#e2f2e5;color:#1d6447;font-weight:900}.index button:hover{background:#eef6ed}
.stage{min-width:0}.paper{min-height:570px;border-radius:26px;border:1px solid #d4e5d7;background:#fffdfa;box-shadow:0 12px 45px #274a2912;overflow:hidden}
.inside{padding:clamp(21px,3.3vw,52px);min-height:570px}.tag{font-size:15px;font-weight:800;color:#31846d;background:#ecf8ed;padding:7px 16px;border-radius:40px;display:inline-block}
h1{font-size:clamp(35px,4.4vw,64px);color:#1f5c46;margin:15px 0 12px;line-height:1.35}h2{color:#286b52;font-size:29px;margin:10px 0}h3{font-size:21px}
.lead{font-size:clamp(21px,2.1vw,28px);line-height:1.9;max-width:870px;color:#49665a}.headline{font-family:"Noto Naskh Arabic",serif;font-size:clamp(28px,3.4vw,48px);line-height:2;color:#1a614d;font-weight:700}
.hero{display:grid;grid-template-columns:1.3fr .8fr;gap:18px;align-items:center}.garden{height:320px;border-radius:50% 50% 26% 26%;display:flex;align-items:end;justify-content:center;font-size:95px;padding:20px;background:linear-gradient(#eff9f9,#c9edca);border-bottom:18px solid #84c08c;box-shadow:inset 0 0 0 14px #f2f8ea}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;border-radius:16px;background:var(--pine);color:white;padding:13px 19px;font-weight:800;font-size:18px;margin:5px;box-shadow:0 5px 12px #1b5b4224}
.btn.alt{background:#e4f1e4;color:var(--pine);box-shadow:none}.btn.gold{background:#c58e32}.btn:hover{filter:brightness(1.08)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.card{border:1px solid #d9e8db;background:#f7fbf5;border-radius:19px;padding:18px;text-align:center;min-width:0}.card .emoji{font-size:55px}.card b{display:block;font-size:27px;color:#255f49;margin:5px 0}.card p{font-size:19px;line-height:1.7}
.quote{background:#e9f4e9;padding:21px;border-right:7px solid #76b396;border-radius:13px;font-size:clamp(24px,3vw,35px);font-family:"Noto Naskh Arabic",serif;line-height:2}
.promptbox{padding:20px;border:1px solid #d5e8d9;background:#f5faf3;border-radius:19px;text-align:center;margin:17px 0}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px auto;max-width:980px}
.opt{padding:22px;background:white;border:2px solid #d7e7db;color:#325c4a;border-radius:17px;font-weight:900;font-size:clamp(19px,2.4vw,31px);min-height:80px}.opt:hover{border-color:#3a926e}.opt.good{background:#e3f6df;border-color:#3b9d6c}.opt.wrong{background:#fce7e1;border-color:#d09b8d}
.feedback{font-size:24px;font-weight:800;color:#34765e;min-height:55px;line-height:1.7;margin-top:13px}.hint{font-size:16px;color:#7b8c82}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;gap:8px}.nav .middle{font-size:16px;color:#617c6c;font-weight:800}
.word{background:#fff;border:2px solid #c6dfc9;border-radius:14px;padding:15px 23px;font-size:26px;font-weight:900;color:var(--pine)}
.slots{border:2px dashed #a9cbaa;min-height:83px;border-radius:15px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;margin:17px 0;background:#f0f8f0}
.video{aspect-ratio:16/9;width:100%;max-width:750px;border:0;border-radius:17px;display:block;margin:12px auto;background:#173c32}
.links a{display:block;text-decoration:none;color:#166b52;border:1px solid #caddcf;border-radius:15px;padding:18px;font-size:21px;font-weight:800;background:#f5faf3;margin:9px 0}
.wheel{margin:auto;width:230px;height:230px;border-radius:50%;background:conic-gradient(#d6e9bc 0 60deg,#f9e9be 60deg 120deg,#e1eef4 120deg 180deg,#f5d9cc 180deg 240deg,#ebdffa 240deg 300deg,#daefdf 300deg 360deg);border:9px solid #fff;box-shadow:0 0 0 3px #bd9d49;display:grid;place-items:center;font-size:87px;transition:transform 1s}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{min-height:95px;border:2px solid #c8e0d0;background:#eef6ed;border-radius:17px;font-size:26px;font-weight:900;color:#265c45}.tile.open{background:#fffbde;border-color:#e4c35d}
.teacherAnswer{display:none;border:2px dashed #83baa0;color:#23644c;background:#eaf7ee;padding:17px;border-radius:15px;font-size:22px;line-height:1.8;margin-top:20px}
body.show-answer .teacherAnswer{display:block}
.counter{font-size:48px;font-weight:900;color:#b6842c;text-align:center}
.footer{text-align:center;color:#647d72;font-size:15px;margin:11px}
@media(max-width:850px){.main{grid-template-columns:1fr}.index{max-height:150px;display:flex;flex-wrap:nowrap;overflow:auto;gap:5px}.index h3{display:none}.index button{min-width:145px}.row{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.garden{height:190px;font-size:70px}.inside{min-height:480px}.options{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.row,.options{grid-template-columns:1fr}.logo strong{font-size:18px}.inside{padding:16px}.paper{min-height:480px}.index{max-height:85px}.tile{font-size:20px;min-height:74px}}
@media print{.top,.teams,.index,.nav{display:none}.main{display:block}.paper{box-shadow:none;border:0}.inside{height:auto}}
</style></head><body>
<div class="wrap">
<header class="top"><div class="logo"><span class="em">🌿</span><span><strong>مغامرة حديقة لغتي</strong><small>عرض المعلمة • الصف الثالث الابتدائي • التعاون</small></span></div><div class="actions"><button class="pill" onclick="toggleAnswer()" id="answerBtn">👁️ إظهار نموذج الإجابة</button><button class="pill" onclick="toggleAudio()" id="audioBtn">🔇 الصوت</button><button class="pill" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">⛶ ملء الشاشة</button></div></header>
<section class="teams"><span class="prompt">🏆 امنحي الفرق نجومًا بعد المشاركة:</span><div class="group">🌿 الأخضر <b id="p0">٠</b> <button onclick="points(0,1)">+</button><button onclick="points(0,-1)">−</button></div><div class="group">🌊 الأزرق <b id="p1">٠</b> <button onclick="points(1,1)">+</button><button onclick="points(1,-1)">−</button></div><div class="group">🌞 الذهبي <b id="p2">٠</b> <button onclick="points(2,1)">+</button><button onclick="points(2,-1)">−</button></div><button class="pill" onclick="resetPoints()">↻ تصفير</button></section>
<div class="main"><aside class="index" id="index"><h3>📍 فهرس الشرائح</h3></aside><div class="stage"><article class="paper"><div class="inside" id="scene"></div></article><nav class="nav"><button class="pill" onclick="go(current-1)">→ الشريحة السابقة</button><span class="middle" id="number"></span><button class="btn" onclick="go(current+1)">الشريحة التالية ←</button></nav></div></div>
<footer class="footer">إعداد المعلمة صالحة الغامدي • الطفولة المبكرة بالابتدائية السادسة والثلاثون – جدة • عرض مباشر تديره المعلمة</footer></div>
<script>
var pages=[["🏡","البداية","home"],["🌼","قصة التعاون","story"],["📖","من الكتاب","book"],["✨","أسلوب التعجب","explain"],["🌷","بستان التعجب","exc"],["🧩","ترتيب الكلمات","build"],["🎡","عجلة الحظ","wheel"],["🎬","فيديو التعجب","video1"],["👦","اسم العلم","name"],["🎯","من المتحدث؟","nameQuiz"],["📚","معرف بأل","al"],["🧺","صندوق التصنيف","sort"],["🃏","بطاقات الذاكرة","memory"],["🎬","فيديو المعرفة","video2"],["🪴","مجموعات التعاون","team"],["⏱️","سباق الأسئلة","speed"],["🗣️","التعبير الشفهي","oral"],["🌐","روابط الألعاب","links"],["🏆","ختام الحصة","end"]];
var current=0,show=false,audio=false,pts=[0,0,0],answer=-1,qIndex={exc:0,nameQuiz:0,team:0},order=[],wheelTurn=0,wheelTask="",sortI=0,openCards=[],doneCards=[],memoryDeck=[],speedI=-1,speedSecs=30,speedTimer=null;
try{var saved=JSON.parse(localStorage.getItem("salha-teacher-garden")||"{}");pts=saved.pts||pts}catch(err){}
function store(){try{localStorage.setItem("salha-teacher-garden",JSON.stringify({pts:pts}))}catch(err){}}
function say(t){if(!audio||!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.89;window.speechSynthesis.speak(u)}
function points(i,d){pts[i]=Math.max(0,pts[i]+d);document.getElementById("p"+i).textContent=pts[i].toLocaleString("ar-SA");store();if(d>0)say("أحسنتم يا أبطال")}
function resetPoints(){if(confirm("هل تريدين تصفير نجوم الفرق؟")){pts=[0,0,0];for(var i=0;i<3;i++)points(i,0)}}
function toggleAudio(){audio=!audio;document.getElementById("audioBtn").textContent=audio?"🔊 الصوت":"🔇 الصوت"}
function toggleAnswer(){show=!show;document.body.classList.toggle("show-answer",show);document.getElementById("answerBtn").textContent=show?"🙈 إخفاء النموذج":"👁️ إظهار نموذج الإجابة"}
function go(n){if(n<0||n>=pages.length)return;current=n;if(show)toggleAnswer();if(speedTimer){clearInterval(speedTimer);speedTimer=null}render();scrollTo({top:0,behavior:"instant"})}
function tag(t){return '<span class="tag">'+t+'</span>'}
function btn(t,js,cl){return '<button class="btn '+(cl||"")+'" onclick="'+js+'">'+t+'</button>'}
function note(s){return '<div class="teacherAnswer">✅ نموذج الإجابة للمعلمة: '+s+'</div>'}
function card(em,t,p){return '<div class="card"><div class="emoji">'+em+'</div><b>'+t+'</b><p>'+p+'</p></div>'}
function vid(id,title,link){return '<h1>🎬 '+title+'</h1><p class="lead">شغّلي المقطع أثناء مشاركة الشاشة، ثم أوقفيه لمناقشة المثال.</p><iframe class="video" src="https://www.youtube-nocookie.com/embed/'+id+'" title="'+title+'" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><div style="text-align:center"><a class="btn alt" target="_blank" rel="noopener noreferrer" href="'+link+'">▶ افتحي الفيديو في يوتيوب</a></div>'}
var qExc=[["حديقة نظيفة، ما أجمل جملة للتعجب؟",["ما أنظفَ الحديقةَ!","أين الحديقة؟","الحديقة نظيفة."],0],["شتلات كثيرة، بماذا نتعجب؟",["ما أوسعَ الساحةَ!","ما أكثرَ الشتلاتِ!","كيف نزرع؟"],1],["وردة زاهية، أكملي: ما ... الوردةَ!",["أزهى","في","على"],0],["ما علامة الترقيم في نهاية التعجب؟",["؟","!","،"],1]];
var qName=[["من قال: في المدرسة ساحة واسعة؟",["حازم","فواز","المعلم"],1],["من قال: الساحة واسعة ونحن صغار؟",["حازم","فواز","الشتلات"],0],["أي الكلمات اسم علم؟",["الحديقة","ماء","فواز"],2]];
var qTeam=[["مهمة المجموعة الأولى",["تنظيف الساحة","سقي الشتلات","الرسم"],0],["مهمة المجموعة الثانية",["الحفر","قراءة الكتب","سقي الشتلات"],0],["مهمة المجموعة الثالثة",["تغرس الشتلات","تفتح المكتبة","تجمع الأقلام"],0],["مهمة المجموعة الرابعة",["تسقي الشتلات بالماء","تقرأ القصة","تحضر التراب فقط"],0]];
function questionGame(kind,arr,title){var i=qIndex[kind]||0;if(i>=arr.length)return tag("أنهيتم التحدي")+'<h1>🎉 أحسنتم جميعًا!</h1><div class="garden">🌟🌺🌳</div>'+btn("إعادة الأسئلة","resetQ('"+kind+"')","alt");
var q=arr[i];var out=tag("السؤال "+(i+1)+" من "+arr.length)+'<h1>'+title+'</h1><div class="promptbox"><div class="headline">'+q[0]+'</div></div><div class="options">';
q[1].forEach(function(x,j){out+='<button class="opt '+(answer===j?(j===q[2]?"good":"wrong"):"")+'" onclick="choose('+j+')">'+x+'</button>'});out+='</div><div class="feedback">'+(answer<0?"🎤 اختاري طالبًا للإجابة، ثم اضغطي اختياره.":answer===q[2]?"🌟 إجابة صحيحة، أحسنتم يا أبطال!":"💡 محاولة جيدة؛ لنكشف الإجابة الصحيحة.")+'</div>';
out+=btn("👁️ اكشفي الإجابة","reveal("+q[2]+")","alt")+btn("السؤال التالي ←","nextQ('"+kind+"')")+note(q[1][q[2]]);return out}
function choose(i){answer=i;render()}
function reveal(i){answer=i;render()}
function nextQ(k){qIndex[k]++;answer=-1;render()}
function resetQ(k){qIndex[k]=0;answer=-1;render()}
function buildSlide(){var words=["الحديقةَ","ما","!","أنظفَ"];var rest=words.filter(function(x){return order.indexOf(x)<0});return tag("اللعبة الثانية • رتب الكلمات")+'<h1>🧩 ابنِ جملة التعجب</h1><p class="lead">اطلبي من الطالب أن يملي ترتيب الكلمات، ثم اضغطيها على الشاشة.</p><div class="slots">'+(order.length?order.map(function(x,i){return '<button class="word" onclick="removeWord('+i+')">'+x+"</button>"}).join(""):"اختاري الكلمات بالترتيب")+'</div><div class="slots">'+rest.map(function(x){return '<button class="word" onclick="addWord('+JSON.stringify(x)+')">'+x+"</button>"}).join("")+'</div>'+btn("تحققي","checkOrder()")+btn("إعادة","order=[];render()","alt")+'<div class="feedback" id="buildFeedback"></div>'+note("ما أنظفَ الحديقةَ !")}
function addWord(w){order.push(w);render()}function removeWord(i){order.splice(i,1);render()}function checkOrder(){document.getElementById("buildFeedback").textContent=order.join("|")==="ما|أنظفَ|الحديقةَ|!"?"🌟 أحسنت! الترتيب صحيح.":"💡 جرّبي: ما ← فعل التعجب ← المتعجب منه ← !"}
var tasks=["تعجّب من نظافة الصف.","تعجّب من كثرة الكتب.","تعجّب من جمال الوردة.","اذكر اسم علم من القصة.","حوّل كلمة شتلات إلى معرفة.","أعط مثالًا على التعاون.","تعجب باستخدام ما أحسن.","تعجّب من أشجار الحديقة."];
function spin(){wheelTurn+=720+Math.floor(Math.random()*250);wheelTask=tasks[Math.floor(Math.random()*tasks.length)];render();say(wheelTask)}
function sortSlide(){var arr=[["فواز","اسم علم"],["الشتلات","معرّف بأل"],["ماء","نكرة"],["المعلّم","معرّف بأل"],["حازم","اسم علم"],["وردة","نكرة"]];if(sortI>=arr.length)return tag("لعبة التصنيف")+'<h1>🎉 فرز ممتاز!</h1>'+btn("إعادة اللعبة","sortI=0;render()","alt");var w=arr[sortI];return tag("المهمة "+(sortI+1)+" من "+arr.length)+'<h1>🧺 صندوق تصنيف الكلمات</h1><div class="promptbox"><div class="headline">'+w[0]+'</div></div><div class="options">'+["اسم علم","معرّف بأل","نكرة"].map(function(x){return '<button class="opt" onclick="sortAnswer('+JSON.stringify(x)+')">'+x+"</button>"}).join("")+'</div><div class="feedback" id="sortMsg">اسألي الطالب أولًا ثم اختاري الصندوق.</div>'+note(w[1])}
function sortAnswer(x){var arr=[["فواز","اسم علم"],["الشتلات","معرّف بأل"],["ماء","نكرة"],["المعلّم","معرّف بأل"],["حازم","اسم علم"],["وردة","نكرة"]];if(x===arr[sortI][1]){sortI++;render()}else document.getElementById("sortMsg").textContent="حاولي مرة أخرى، ما نوع الكلمة؟"}
function freshMemory(){var pairs=[["ماء","الماء"],["شتلات","الشتلات"],["حديقة","الحديقة"],["معلم","المعلم"]];memoryDeck=[];pairs.forEach(function(p,i){p.forEach(function(t){memoryDeck.push({t:t,p:i})})});memoryDeck.sort(function(){return Math.random()-.5});openCards=[];doneCards=[]}
function memorySlide(){if(memoryDeck.length===0)freshMemory();return tag("لعبة الذاكرة")+'<h1>🃏 اكشفي الأزواج</h1><p class="lead">اختاري بطاقتين لتكوين زوج من نكرة ومعرفة بأل.</p><div class="memory">'+memoryDeck.map(function(x,i){var isOpen=openCards.includes(i)||doneCards.includes(i);return '<button class="tile '+(isOpen?"open":"")+'" onclick="flip('+i+')">'+(isOpen?x.t:"🌿 ؟")+"</button>"}).join("")+'</div><p class="lead">الأزواج المكتشفة: '+(doneCards.length/2)+' / ٤</p>'+btn("🔄 أعيدي البطاقات","freshMemory();render()","alt")}
var lock=false;function flip(i){if(lock||openCards.includes(i)||doneCards.includes(i))return;openCards.push(i);render();if(openCards.length===2){var a=openCards[0],b=openCards[1];if(memoryDeck[a].p===memoryDeck[b].p){doneCards.push(a,b);openCards=[];setTimeout(render,220)}else{lock=true;setTimeout(function(){openCards=[];lock=false;render()},950)}}}
var quick=[["أي جملة تعجب؟",["ما أجملَ الحديقةَ!","هل الحديقة نظيفة؟"],0],["فواز اسم...",["علم","نكرة"],0],["الماء كلمة...",["معرفة بأل","نكرة"],0],["شتلات تصبح...",["الشتلات","شتل"],0],["علامة التعجب...",["!","؟"],0]];
function speedSlide(){var content=tag("سباق الأسئلة")+'<h1>⏱️ سباق النجوم</h1><p class="lead">اختاري فريقًا، وابدئي السباق؛ خمسة أسئلة في ٣٠ ثانية.</p><div class="counter" id="counter">'+speedSecs+' ثانية</div>';
if(speedI<0)content+='<div class="garden">🚀🌟</div>'+btn("▶ ابدئي المؤقت","startSpeed()");
else if(speedI>=quick.length)content+='<h2>🎉 انتهت الأسئلة!</h2>'+btn("إعادة السباق","restartSpeed()","alt");
else content+='<div class="promptbox"><div class="headline">'+quick[speedI][0]+'</div></div><div class="options">'+quick[speedI][1].map(function(x,i){return '<button class="opt" onclick="pickSpeed('+i+')">'+x+"</button>"}).join("")+'</div>';
return content}
