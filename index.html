function renderPicture(q,p,visible){
  const panel=$('picture-panel'); if(!panel)return;
  if(!visible){panel.classList.add('waiting');panel.innerHTML='';return}
  panel.classList.remove('waiting');
  panel.innerHTML='<div class="picture-canvas">'+pictureSVG(q,p)+'</div>';
}

function render(){let e=bank[ei],q=e.questions[qi],p=e.passages[q.passageIndex]||e.passages[0];$('pt').textContent=p.title;$('pv').textContent=p.text;$('qt').textContent='السؤال '+(qi+1)+': '+q.text;$('count').textContent='السؤال '+(qi+1)+' من '+e.questions.length;$('opts').innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(answers[qi]===i?' sel':'')+(review&&i===q.correctIndex?' correct':review&&answers[qi]===i?' wrong':'');b.textContent=letters[i]+'- '+v;b.onclick=()=>choose(i);$('opts').append(b)});$('prev').disabled=qi===0;$('next').disabled=qi===e.questions.length-1;$('finish').classList.toggle('hidden',review);$('bubbles').innerHTML='';e.questions.forEach((_,j)=>{let row=document.createElement('div');row.className='brow'+(j===qi?' active':'');let n=document.createElement('span');n.textContent=j+1;row.append(n);letters.forEach((l,k)=>{let b=document.createElement('button');b.className='bubble'+(answers[j]===k?' sel':'');b.textContent=l;b.onclick=()=>{qi=j;if(!review){answers[j]=k;tone(k===e.questions[j].correctIndex)}render()};row.append(b)});$('bubbles').append(row)});let selected=answers[qi],visible=review||selected>=0;$('fbtitle').textContent=!visible?'التغذية الراجعة والشرح':review?'مراجعة السؤال':selected===q.correctIndex?'أحسنت! إجابة صحيحة':'إجابة غير صحيحة، تعلم من الشرح';$('fb').textContent=visible?explain(q,p):'اختر إجابة لتظهر لك التغذية الراجعة وشرح المهارة.';$('skill').textContent='المهارة: '+(q.skill||'فهم المقروء');$('art').textContent=pict(q);renderPicture(q,p,visible)}function choose(i){if(review)return;answers[qi]=i;tone(i===bank[ei].questions[qi].correctIndex);render()}$('prev').onclick=()=>{if(qi>0){qi--;tone();render()}};$('next').onclick=()=>{if(qi<bank[ei].questions.length-1){qi++;tone();render()}};$('finish').onclick=()=>{let missing=answers.indexOf(-1);if(missing>=0){qi=missing;render();alert('يرجى الإجابة عن السؤال '+(missing+1));return}let qs=bank[ei].questions,score=qs.filter((q,i)=>answers[i]===q.correctIndex).length;localStorage.setItem('nafes_done_'+ei,'1');$('score').textContent=score+' / '+qs.length;$('resultmsg').textContent=score/qs.length>=.8?'🌟 أداء رائع!':score/qs.length>=.6?'أداء جيد، واصل التقدم':'راجع الشرح وحاول مرة أخرى';show('result');tone(true)};$('review').onclick=()=>{review=true;qi=0;show('exam');render()};$('home').onclick=index;$('back').onclick=index;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 الصوت':'🔇 صامت'};index();
</script></body></html>
