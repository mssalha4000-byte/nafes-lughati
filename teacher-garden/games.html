<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#1c674e"/><title>ألعاب حديقة لغتي | صالحة الغامدي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#195944;--sage:#e4f2e7;--orange:#eaa95e;--ink:#29473d;--surface:#fffefa;--mist:#f5faf5;--line:#cfe2d5}*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:radial-gradient(circle at 15% 8%,#fff8dd 0,transparent 34%),radial-gradient(circle at 95% 90%,#d9f3e8 0,transparent 40%),#f1f6ee;color:var(--ink);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #eeaf57;outline-offset:3px}
.wrap{max-width:1130px;margin:auto;padding:19px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fffefa;border:1px solid #d7e7db;box-shadow:0 10px 34px #215b4310;padding:15px 23px;border-radius:24px}.brand{font-weight:900;color:var(--forest);font-size:24px}.sub{font-size:14px;color:#72897a}.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btt{background:var(--forest);color:white;border:0;border-radius:14px;padding:12px 17px;font-weight:900;box-shadow:0 7px 12px #0c513a16}.btt.secondary{background:#e0f1e4;color:var(--forest);box-shadow:none}.btt.gold{background:#bd8339}.btt:disabled{opacity:.5;cursor:default}
.screen{background:var(--surface);border:1px solid #d9e6d7;box-shadow:0 20px 55px #1d543c12;border-radius:30px;margin-top:19px;padding:clamp(22px,4vw,49px);min-height:550px;overflow:hidden}.tag{display:inline-block;background:#e5f3e8;color:#267356;font-weight:900;border-radius:40px;font-size:15px;padding:8px 17px}
h1{color:#1b6549;font-size:clamp(31px,4.7vw,55px);margin:13px 0;line-height:1.3}h2{color:#276b53;font-size:clamp(24px,3.3vw,38px)}p{font-size:20px;line-height:1.75}.lead{color:#667f70;max-width:830px}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:25px 0}.game{border:1px solid var(--line);border-bottom:5px solid #b2d3ba;background:#fbfef9;border-radius:20px;padding:21px;cursor:pointer;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .2s,box-shadow .2s;color:var(--forest)}.game:hover{transform:translateY(-5px);box-shadow:0 12px 26px #236c4426}.game .big{font-size:58px}.game strong{font-size:24px}.game span:last-child{font-size:15px;color:#688173;padding-top:7px}
.progress{height:11px;border-radius:12px;background:#e8efea;overflow:hidden;margin:12px 0 26px}.fill{height:100%;background:linear-gradient(90deg,#77c989,#1c855a);transition:width .4s}
.bigquestion{padding:22px 15px;background:#edf7eb;border:1px solid #d0e7d5;border-radius:20px;text-align:center;font-family:"Noto Naskh Arabic",serif;font-size:clamp(25px,3.8vw,39px);line-height:1.85;color:#1d5f46}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}.choice{background:#fff;border:2px solid #d1e3d7;border-radius:18px;padding:20px;min-height:80px;color:#245c46;font-weight:900;font-size:clamp(21px,2.6vw,28px)}.choice:hover{background:#eff9ec;border-color:#68b48a}.choice.correct{background:#e1f7e1;border-color:#54a478}.choice.incorrect{background:#fce7e4;border-color:#df938a}
.message{font-size:22px;font-weight:900;color:#297956;min-height:60px;text-align:center;padding:10px}.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid #d4e4d7;background:#f3faf2;border-radius:13px;padding:8px 14px;font-weight:900;color:#29674f}.stage{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin:20px 0}.plant{width:160px;min-height:190px;border:2px solid #d5e9d7;border-radius:23px;background:#edf9ec;text-align:center;padding:15px;transition:transform .25s}.plant.grown{background:#e2f9e2;transform:translateY(-7px)}.plant .art{font-size:80px;display:block}.plant strong{font-size:20px;color:#2c7652}
.flowers{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}.flower{border:2px solid #d3e6d1;background:#fff;padding:15px;border-radius:15px;font-size:24px;font-weight:900;min-width:120px;color:#28644c}.flower:hover{border-color:#56ad72}
.fishpond{height:290px;border-radius:45% 42% 20% 25%;background:radial-gradient(circle at 24% 19%,#b9eff0,#79c9d8 52%,#4696b8);border:9px solid #cbe7df;position:relative;overflow:hidden;margin:18px 0}
.fish{position:absolute;display:flex;gap:4px;align-items:center;border:2px solid #f7f0bf;background:#fff6d0;color:#236047;border-radius:55px;padding:11px;font-weight:900;font-size:22px;animation:swim 3s ease-in-out infinite alternate;max-width:38%;box-shadow:0 8px 18px #28689926}
.fish:nth-child(2){animation-delay:-1s}.fish:nth-child(3){animation-delay:-2s}@keyframes swim{from{transform:translateX(-14px)}to{transform:translateX(24px)}}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:15px}.colCard{background:#f5faf3;border:1px solid #d4e9d6;border-radius:18px;padding:17px;text-align:center}.colCard h3{font-size:21px;color:#2c6c50}
.pair{display:block;width:100%;border:2px solid #cfe3d2;border-radius:14px;background:white;padding:14px;font-size:25px;color:#286148;font-weight:900;margin:8px 0}.pair.active{background:#ffe7a3;border-color:#d5a145}.pair.matched{background:#dcf4d8;color:#4e8a63;border-color:#a6cdae}
.chests{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.chest{min-height:133px;background:#f4e3b1;border:3px solid #d7b065;border-radius:20px;box-shadow:0 9px 0 #d5a968;color:#765321;font-size:62px}.chest.done{background:#e8f5e6;border-color:#add5b9;opacity:.68;box-shadow:none}.chest:hover:not(:disabled){transform:translateY(-4px)}
.wordtray{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;border:2px dashed #b3cfba;border-radius:18px;background:#eef9ec;min-height:93px;padding:13px;margin:15px 0}.word{padding:13px 20px;border:2px solid #9ecaae;background:white;color:#25694e;font-weight:900;font-size:25px;border-radius:13px}.word:hover{background:#e4f8e2}
.medal{font-size:100px;text-align:center;margin:15px}.score{font-size:57px;color:#b5812d;font-weight:900;text-align:center}.certificate{border:7px double #c9a562;border-radius:24px;text-align:center;background:linear-gradient(135deg,#fff9e5,#f5fbf1);padding:24px;max-width:690px;margin:25px auto}.certName{font-size:36px;color:#236248;font-weight:900}
input.name{border:2px solid #b5d2bd;border-radius:14px;padding:14px 16px;font-size:22px;text-align:center;width:min(100%,340px);background:#fff}
.footer{text-align:center;color:#6f8477;font-size:14px;padding:15px}.modalOverlay{position:fixed;inset:0;background:#1a3a2c88;z-index:20;display:flex;justify-content:center;align-items:center;padding:13px}.modal{max-width:520px;width:100%;background:#fffefa;padding:25px;border-radius:25px;box-shadow:0 20px 80px #15332350}.notice{font-size:16px;color:#778e81}
@media(max-width:700px){.hub{grid-template-columns:repeat(2,1fr);gap:9px}.game{min-height:155px;padding:12px}.game .big{font-size:48px}.answers{grid-template-columns:1fr}.screen{padding:18px;min-height:470px}.columns{gap:8px}.colCard{padding:10px}.chests{grid-template-columns:repeat(2,1fr)}.fishpond{height:230px}.fish{font-size:16px;max-width:44%;padding:8px}.pair{font-size:20px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">🌿 حديقة لغتي <span style="color:#d1a044">✦</span> ألعابنا التفاعلية</div><div class="sub">لغتي ثالث • أسلوب التعجب • اسم العلم • المعرّف بأل • التعاون</div></div><div class="topright"><span class="chip" id="stars">⭐ ٠</span><button class="btt secondary" onclick="showHub()">🏠 كل الألعاب</button><button class="btt secondary" id="sound" onclick="toggleSound()">🔊 التشجيع</button></div></header><main class="screen" id="app"></main><footer class="footer">إعداد المعلمة صالحة الغامدي • الطفولة المبكرة بالابتدائية السادسة والثلاثون – جدة<br>ألعاب أصلية تعمل دون تسجيل حساب؛ تحفظ نجوم اللعب على الجهاز فقط.</footer></div>
<script>
const GAMEINFO=[["quiz","🎯","تحدي الأبطال","اختر الإجابة واكسب النجوم"],["flowers","🌻","ازرع بستان التعجب","اسقِ الزهرة بالكلمة المناسبة"],["fishing","🐟","صيد الكلمات","اصطد الكلمة الصحيحة في البركة"],["match","🔗","التوصيل الذكي","صِل النكرة بالمعرّف بأل"],["boxes","🎁","صناديق المفاجآت","افتح صندوقًا وأجب"],["train","🚂","قطار الجمل","رتّب الكلمات لتصنع جملة"],["memory","🃏","ذاكرة البستان","اكتشف زوجًا متطابقًا"],["wheel","🎡","عجلة التعاون","أدر العجلة وأجب عن المهمة"]];
const quiz=[["أي عبارة تعبّر عن التعجب من حديقة نظيفة؟",["ما أنظفَ الحديقةَ!","الحديقة نظيفة.","أين الحديقة؟"],0],["عند رؤية شتلات كثيرة نقول:",["ما أصغرَ الشتلاتَ!","ما أكثرَ الشتلاتِ!","ما اسم الشتلات؟"],1],["أكمِل: ما … الوردةَ!",["أزهى","أين","هذه"],0],["أي اسم من الآتي عَلَم؟",["التلميذ","فواز","الحديقة"],1],["ما المعرّف بأل من «ماء»؟",["مياه","الماء","ماؤه"],1],["من اقترح زراعة الساحة؟",["فواز","حازم","الشتلة"],0],["من ردّ بأنهم صغار؟",["المدير","حازم","النحلة"],1],["ما علامة الترقيم المناسبة للتعجب؟",["؟","،","!"],2]];
const flowerQs=[["حديقة نظيفة","ما ____ الحديقةَ!",["أنظفَ","أكثرَ","أصغرَ"],0,"🌳"],["شتلات كثيرة","ما ____ الشتلاتِ!",["أبعدَ","أكثرَ","أنظفَ"],1,"🪴"],["وردة زاهية","ما ____ الوردةَ!",["أزهى","أوسعَ","أشدَّ"],0,"🌺"],["فصل جميل","ما ____ الفصلَ!",["أجملَ","أسرعَ","أكثرَ"],0,"🏫"]];
const fishQs=[["اصطد اسم العلم",["فواز","الحديقة","شتلات"],0],["اصطد كلمة معرفة بأل",["ماء","المعلّم","حازم"],1],["اصطد كلمة نكرة",["الوردة","الماء","شتلات"],2],["اصطد اسم العلم",["حازم","معلم","الشتلات"],0],["اصطد الكلمة المعرّفة بأل",["حديقة","الحديقة","زهرة"],1]];
const matchPairs=[["ماء","الماء"],["شتلات","الشتلات"],["حديقة","الحديقة"],["معلّم","المعلّم"],["وردة","الوردة"]];
const boxQs=[["ما اسم من اقترح زراعة الحديقة؟","فواز"],["من قال: نحن صغار؟","حازم"],["من قام بتنظيف الساحة؟","المجموعة الأولى"],["من قام بحفر الحفر؟","المجموعة الثانية"],["من غرس الشتلات؟","المجموعة الثالثة"],["من سقى الشتلات بالماء؟","المجموعة الرابعة"],["ما أكثرَ ____!","الشتلاتِ"],["ما أزهى ____!","الوردةَ"]];
const trainQs=[["ما","أنظفَ","الحديقةَ","!"],["ما","أكثرَ","الشتلاتِ","!"],["ما","أزهى","الوردةَ","!"],["ما","أجملَ","التعاونَ","!"]];
const wheelQs=[["🍃","تعاون","ماذا اقترح فواز؟","زراعة الساحة لتصبح حديقة"],["💧","الريّ","من يسقي الشتلات؟","المجموعة الرابعة"],["🪴","الغرس","من يغرس الشتلات؟","المجموعة الثالثة"],["🧹","النظافة","من ينظف الساحة؟","المجموعة الأولى"],["🌺","التعجب","تعجب من وردة زاهية.","ما أزهى الوردةَ!"],["📚","المعرفة","حوّل «معلّم» إلى معرفة بأل.","المعلّم"],["👦","العلم","اذكر اسم علم من الدرس.","فواز أو حازم"],["⭐","القيمة","كيف نجتاز الصعوبات؟","بالتعاون"]];
const app=document.querySelector("#app"),sel=new URLSearchParams(location.search),state={game:GAMEINFO.some(x=>x[0]===sel.get("game"))?sel.get("game"):null,idx:0,score:0,choice:-1,seq:[],matched:[],pick:null,open:[],deck:[],boxes:[],box:-1,spin:0,spinning:false,fishOpts:[],done:false},safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let player="";try{player=sessionStorage.getItem("salha-garden-player")||""}catch(e){}let sound=true;try{sound=localStorage.getItem("salha-garden-sound")!=="off"}catch(e){}
let total=0;try{total=Number(localStorage.getItem("salha-garden-stars"))||0}catch(e){}
function updateStars(){document.getElementById("stars").textContent="⭐ "+total.toLocaleString("ar-SA")}
function speak(txt){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(txt);utter.lang="ar-SA";utter.rate=.96;utter.pitch=1.1;speechSynthesis.speak(utter)}catch(e){}}
function toggleSound(){sound=!sound;document.getElementById("sound").textContent=sound?"🔊 التشجيع":"🔇 التشجيع";try{localStorage.setItem("salha-garden-sound",sound?"on":"off")}catch(e){}}
function celebrate(n=1){state.score+=n;total+=n;try{localStorage.setItem("salha-garden-stars",String(total))}catch(e){}updateStars();speak(["أحسنت يا بطل!","رائع! إجابة صحيحة","ممتاز يا نجم!"][Math.floor(Math.random()*3)]);var e=document.createElement("div");e.style.cssText="position:fixed;inset:0;z-index:99;pointer-events:none;display:grid;place-items:center;font-size:100px;animation:floatUp .8s both";e.textContent="🌟";document.body.appendChild(e);setTimeout(()=>e.remove(),750)}
function tag(x){return '<span class="tag">'+x+'</span>'}function but(t,fn,cl=""){return '<button class="btt '+cl+'" onclick="'+fn+'">'+t+'</button>'}
function page(s){app.innerHTML=s}function topLine(title,subtitle){return tag("تعلّم والعب • لغتي ثالث")+'<h1>'+title+'</h1><p class="lead">'+subtitle+'</p>'}
function progress(i,n){return '<div class="status"><span class="chip">السؤال '+Math.min(i+1,n)+' / '+n+'</span><span class="chip">نجوم هذه اللعبة ⭐ '+state.score+'</span></div><div class="progress"><div class="fill" style="width:'+(i/n*100)+'%"></div></div>'}
function showHub(){history.replaceState(null,"",location.pathname);state.game=null;draw()}
function start(k){state.game=k;state.idx=0;state.score=0;state.choice=-1;state.seq=[];state.matched=[];state.pick=null;state.open=[];state.deck=[];state.boxes=[];state.box=-1;state.done=false;state.spin=0;state.spinning=false;history.replaceState(null,"",location.pathname+"?game="+encodeURIComponent(k));draw()}
function share(id){const url=location.origin+location.pathname+"?game="+id;copy(url)}
function copy(txt){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>toast("✅ نُسخ الرابط")).catch(()=>prompt("انسخي الرابط",txt))}else prompt("انسخي الرابط",txt)}
function toast(t){let x=document.getElementById("toast");if(x)x.remove();x=document.createElement("div");x.id="toast";x.textContent=t;x.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:101;background:#215b47;color:white;border-radius:15px;padding:13px 22px;font-weight:900";document.body.appendChild(x);setTimeout(()=>x.remove(),2000)}
function draw(){updateStars();if(!state.game){page(topLine("🌈 اختَر مغامرتك في حديقة لغتي","ثماني ألعاب أصلية بأفكار مختلفة. يمكن للمعلمة عرضها في الحصة أو مشاركة رابط كل لعبة مع الطلاب والطالبات.")+'<div class="hub">'+GAMEINFO.map(g=>'<div class="game" onclick="start(\''+g[0]+'\')"><span class="big">'+g[1]+'</span><strong>'+g[2]+'</strong><span>'+g[3]+'</span><button class="btt secondary" style="margin-top:12px" onclick="event.stopPropagation();share(\''+g[0]+'\')">🔗 نسخ رابط اللعبة</button></div>').join("")+'</div><p class="notice">تُحفظ النجوم على جهاز كل لاعب فقط. يمكن للمعلمة منح نجوم التعزيز في لوحة العرض الرئيسية.</p>');return}
if(state.done){finishScreen();return}switch(state.game){case"quiz":drawQuiz();break;case"flowers":drawFlowers();break;case"fishing":drawFishing();break;case"match":drawMatch();break;case"boxes":drawBoxes();break;case"train":drawTrain();break;case"memory":drawMemory();break;case"wheel":drawWheel();break;}}
function finishScreen(){const game=GAMEINFO.find(g=>g[0]===state.game);page(tag("أكملت التحدي")+'<div class="certificate"><div class="medal">🏆</div><h1>شهادة نجم الحديقة</h1><p>أبدعت في لعبة <b>'+game[2]+'</b></p><div class="certName">'+(player?safe(player):"يا نجم لغتي")+'</div><p>حصلت على:</p><div class="score">⭐ '+state.score.toLocaleString("ar-SA")+'</div><p>أحسنت! استمر في التعلم يا بطل 🌿</p></div><div style="text-align:center">'+but("🔁 أعد اللعبة","start('"+state.game+"')")+but("🏠 ألعاب أخرى","showHub()","secondary")+'</div>')}
function next(n){state.idx+=1;state.choice=-1;if(state.idx>=n){state.done=true;speak("أحسنتم يا أبطال لغتي!")}draw()}
function chooseQuiz(i){if(state.choice!==-1)return;state.choice=i;if(i===quiz[state.idx][2])celebrate(2);drawQuiz()}
function drawQuiz(){let q=quiz[state.idx];page(topLine("🎯 تحدي الأبطال","اختر الإجابة الصحيحة قبل الانتقال للسؤال التالي.")+progress(state.idx,quiz.length)+'<div class="bigquestion">'+q[0]+'</div><div class="answers">'+q[1].map((x,i)=>'<button class="choice '+(state.choice!==-1?(i===q[2]?"correct":i===state.choice?"incorrect":""):"")+'" onclick="chooseQuiz('+i+')">'+x+'</button>').join("")+'</div><div class="message">'+(state.choice===-1?"🎤 فكّر ثم اختر":state.choice===q[2]?"🌟 ممتاز! الإجابة صحيحة.":"🌱 حاول مجددًا في السؤال التالي. الإجابة الصحيحة باللون الأخضر.")+'</div><div style="text-align:center">'+(state.choice!==-1?but("التالي ←","next("+quiz.length+")"):"")+'</div>')}
function answerFlower(i){if(state.choice!==-1)return;state.choice=i;if(i===flowerQs[state.idx][3])celebrate(3);drawFlowers()}
function drawFlowers(){let q=flowerQs[state.idx];page(topLine("🌻 ازرع بستان التعجب","اختر الكلمة الصحيحة لتسقي نباتك. كل إجابة صحيحة تنمّي الزهرة!")+progress(state.idx,flowerQs.length)+'<div class="stage">'+flowerQs.map((f,i)=>'<div class="plant '+(state.idx>i||state.idx===i&&state.choice===f[3]?"grown":"")+'"><span class="art">'+(state.idx>i||state.idx===i&&state.choice===f[3]?"🌻":"🌱")+'</span><strong>النبتة '+(i+1)+'</strong></div>').join("")+'</div><div class="bigquestion">'+q[1]+'</div><div class="answers">'+q[2].map((x,i)=>'<button class="choice '+(state.choice!==-1?(i===q[3]?"correct":i===state.choice?"incorrect":""):"")+'" onclick="answerFlower('+i+')">💧 '+x+'</button>').join("")+'</div><div class="message">'+(state.choice<0?"اسقِ النبتة الصحيحة 💧":state.choice===q[3]?"نمت زهرتك 🌺":"ليست الكلمة المناسبة، تعلّمنا من المحاولة.")+'</div>'+(state.choice>=0?but("النبتة التالية","next("+flowerQs.length+")"):""))}
function fishSelect(i){if(state.choice!==-1)return;state.choice=i;if(i===fishQs[state.idx][2])celebrate(2);drawFishing()}
function drawFishing(){let q=fishQs[state.idx];let coords=[[9,15],[57,40],[24,67]];page(topLine("🐟 صيد الكلمات","في البركة أسماك متحركة؛ اصطد السمكة التي تحمل الإجابة الصحيحة.")+progress(state.idx,fishQs.length)+'<div class="bigquestion">'+q[0]+'</div><div class="fishpond">'+q[1].map((x,i)=>'<button class="fish '+(state.choice>=0?(i===q[2]?"correct":i===state.choice?"incorrect":""):"")+'" style="right:'+coords[i][0]+'%;top:'+coords[i][1]+'%" onclick="fishSelect('+i+')">🐟 '+x+'</button>').join("")+'</div><div class="message">'+(state.choice<0?"🎣 أي سمكة تختار؟":state.choice===q[2]?"👏 صيّاد ماهر!":"🌱 الإجابة الصحيحة: "+q[1][q[2]])+'</div>'+(state.choice>=0?but("الصيد التالي","next("+fishQs.length+")"):""))}
function selectPair(side,i){if(side==="r"){state.pick=i;drawMatch();return}if(state.pick===null){toast("اختَر كلمة من العمود الأول");return}let chosen=state.pick;state.pick=null;if(chosen===i){if(!state.matched.includes(i)){state.matched.push(i);celebrate(2)}if(state.matched.length===matchPairs.length){state.done=true}}else toast("🌱 جرّب توصيل كلمة أخرى");draw()}
function drawMatch(){let order=[2,4,0,3,1];page(topLine("🔗 التوصيل الذكي","اضغط على الكلمة النكرة ثم الكلمة المعرفة بأل التي تناسبها.")+'<div class="status"><span class="chip">الأزواج '+state.matched.length+" / "+matchPairs.length+'</span><span class="chip">⭐ '+state.score+'</span></div><div class="columns"><div class="colCard"><h3>🧩 نكرة</h3>'+matchPairs.map((p,i)=>'<button class="pair '+(state.matched.includes(i)?"matched":state.pick===i?"active":"")+'" onclick="selectPair(\'r\','+i+')" '+(state.matched.includes(i)?"disabled":"")+'>'+p[0]+'</button>').join("")+'</div><div class="colCard"><h3>🔑 معرفة بأل</h3>'+order.map(i=>'<button class="pair '+(state.matched.includes(i)?"matched":"")+'" onclick="selectPair(\'l\','+i+')" '+(state.matched.includes(i)?"disabled":"")+'>'+matchPairs[i][1]+'</button>').join("")+'</div></div>')}
function openBox(i){if(state.boxes.includes(i))return;state.box=i;state.choice=-1;drawBoxes()}
function boxGrade(ok){if(state.choice!==2)return;state.choice=ok?1:0;if(ok)celebrate(2);state.boxes.push(state.box);drawBoxes()}
function closeBox(){state.box=-1;if(state.boxes.length===boxQs.length){state.done=true}draw()}
function drawBoxes(){page(topLine("🎁 صناديق المفاجآت","افتح صندوقًا، ثم أجب بصوتك أو في دفترك، واكشف الإجابة لتقيّم نفسك.")+'<div class="status"><span class="chip">الصناديق المكتملة '+state.boxes.length+' / '+boxQs.length+'</span><span class="chip">⭐ '+state.score+'</span></div><div class="chests">'+boxQs.map((x,i)=>'<button class="chest '+(state.boxes.includes(i)?"done":"")+'" '+(state.boxes.includes(i)?"disabled":"")+' onclick="openBox('+i+')">'+(state.boxes.includes(i)?"✅":"🎁")+'<div style="font-size:18px">'+(i+1)+'</div></button>').join("")+'</div>'+(state.box>=0?'<div class="modalOverlay"><div class="modal">'+tag("الصندوق "+(state.box+1))+'<h2>'+boxQs[state.box][0]+'</h2>'+(state.choice===-1?'<p>فكّر في الإجابة ثم اضغط لكشفها.</p>'+but("👁️ كشف الإجابة","boxReveal()"):('<div class="bigquestion">'+boxQs[state.box][1]+'</div><p>هل كانت إجابتك صحيحة؟</p>'+but("🌟 نعم، صحيحة","boxGrade(true)")+but("🌱 سأحاول مجددًا","boxGrade(false)","secondary") ))+(state.choice!==-1?'<div style="margin-top:10px">'+but("العودة للصناديق","closeBox()","secondary")+'</div>':"")+'</div></div>':""))}
let boxWasRevealed=false;function boxReveal(){state.choice=2;drawBoxesRevealed()}
function drawBoxesRevealed(){let box=state.box;drawBoxes();let overlay=document.querySelector(".modal");if(overlay)overlay.innerHTML=tag("الإجابة النموذجية")+'<h2>'+boxQs[box][0]+'</h2><div class="bigquestion">'+boxQs[box][1]+'</div><p>هل كانت إجابتك صحيحة؟</p>'+but("🌟 نعم، صحيحة","boxGrade(true)")+but("🌱 سأحاول مجددًا","boxGrade(false)","secondary")}
function trainAdd(i){if(state.seq.includes(i))return;state.seq.push(i);drawTrain()}
function trainRemove(i){state.seq.splice(i,1);drawTrain()}
function trainCheck(){if(state.seq.length!==4){toast("رتب الكلمات الأربع أولًا");return}if(state.seq.every((x,i)=>x===i)){celebrate(3);state.choice=1}else state.choice=0;drawTrain()}
function drawTrain(){let parts=trainQs[state.idx],mixed=[2,0,3,1];page(topLine("🚂 قطار الجمل","اجمع الكلمات بالترتيب الصحيح حتى يصل قطار التعجب إلى المحطة.")+progress(state.idx,trainQs.length)+'<div class="bigquestion">🚂 رتِّب الكلمات لتكوين جملة تعجب صحيحة</div><h3>محطات القطار بالترتيب:</h3><div class="wordtray">'+(state.seq.length?state.seq.map((v,i)=>'<button class="word" onclick="trainRemove('+i+')">'+parts[v]+'</button>').join(""):"انقر الكلمات أسفل لتضعها على القطار")+'</div><h3>الكلمات:</h3><div class="wordtray">'+mixed.filter(i=>!state.seq.includes(i)).map(i=>'<button class="word" onclick="trainAdd('+i+')">'+parts[i]+'</button>').join("")+'</div><div class="message">'+(state.choice===1?"🌟 وصل القطار إلى المحطة!":state.choice===0?"🌱 ترتيب غير صحيح، حاول مجددًا.":"أول كلمة هي «ما»، وآخر رمز «!»")+'</div><div style="text-align:center">'+(state.choice===1?but("الجملة التالية","state.seq=[];next("+trainQs.length+")"):but("✅ تحقق من الترتيب","trainCheck()"))+" "+but("↻ إعادة ترتيب","state.seq=[];state.choice=-1;drawTrain()","secondary")+'</div>')}
function prepMemory(){let arr=[];matchPairs.slice(0,4).forEach((p,i)=>p.forEach(t=>arr.push({id:i,t})));state.deck=arr.sort(()=>Math.random()-.5);state.open=[];state.matched=[];state.busy=false}
function flip(i){if(state.busy||state.open.includes(i)||state.matched.includes(i))return;state.open.push(i);drawMemory();if(state.open.length===2){let [a,b]=state.open;if(state.deck[a].id===state.deck[b].id){state.matched.push(a,b);celebrate(2);state.open=[];if(state.matched.length===state.deck.length){state.done=true;setTimeout(draw,360)}else setTimeout(drawMemory,350)}else{state.busy=true;setTimeout(()=>{state.open=[];state.busy=false;drawMemory()},900)}}}
function drawMemory(){if(!state.deck.length)prepMemory();page(topLine("🃏 ذاكرة البستان","انقر بطاقتين وابحث عن النكرة والمعرّف بأل المقابل لها.")+'<div class="status"><span class="chip">الأزواج '+state.matched.length/2+' / ٤</span><span class="chip">⭐ '+state.score+'</span></div><div class="chests">'+state.deck.map((x,i)=>'<button class="chest '+(state.matched.includes(i)?"done":"")+'" style="font-size:25px" onclick="flip('+i+')" '+(state.matched.includes(i)?"disabled":"")+'>'+(state.open.includes(i)||state.matched.includes(i)?x.t:"🌿 ؟")+'</button>').join("")+'</div>')}
function drawWheel(){let q=wheelQs[state.idx%wheelQs.length];page(topLine("🎡 عجلة التعاون","أدر العجلة، ونفذ المهمة التي تختارها لك.")+'<div style="text-align:center"><div style="margin:auto;width:250px;height:250px;border-radius:50%;border:10px solid white;box-shadow:0 0 0 4px #cda64f;background:conic-gradient(#fee8a0 0 45deg,#c9f1df 45deg 90deg,#e7defb 90deg 135deg,#ffccbc 135deg 180deg,#e3ebfb 180deg 225deg,#d5f4bc 225deg 270deg,#ffe5cd 270deg 315deg,#d9e6f6 315deg);display:grid;place-items:center;transform:rotate('+state.spin+'deg);transition:transform 1s"><span style="font-size:100px">🎡</span></div><div class="bigquestion" style="margin:22px auto;max-width:760px">'+(state.choice===-1?"🎲 اضغط زر العجلة لتبدأ":q[2])+'</div>'+(state.choice===1?'<div class="message">✅ '+q[3]+'</div>':"")+(state.choice===0?but("👁️ اعرض الإجابة","revealWheel()","secondary"):"")+'<div style="margin-top:19px">'+but("🎡 أدر العجلة","spinWheel()","gold")+" "+(state.choice===1?but("🌟 أحسنت! نجمة","wheelAward()"):"")+'</div><p class="notice">تحصل على نجمة بعد حل المهمة بشكل صحيح.</p></div>')}
function spinWheel(){if(state.spinning)return;state.spinning=true;state.spin+=720+Math.floor(Math.random()*300);state.idx=Math.floor(Math.random()*wheelQs.length);state.choice=0;drawWheel();setTimeout(()=>state.spinning=false,1100)}
function revealWheel(){state.choice=1;drawWheel()}
function wheelAward(){celebrate(2);state.choice=-1;drawWheel()}
if(state.game)start(state.game);else draw();updateStars();
</script></body></html>
