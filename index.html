const bank=JSON.parse(document.getElementById('bank').textContent).exams;let ei=-1,qi=0,answers=[],review=false,sound=true,ac;const $=id=>document.getElementById(id),letters=['أ','ب','ج','د'];const num=n=>String(n);function tone(ok){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok===true?850:ok===false?260:560;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);o.start();o.stop(ac.currentTime+.15)}catch(e){}}function show(id){for(let s of ['index','exam','result'])$(s).classList.toggle('hidden',s!==id)}function index(){show('index');$('tests').innerHTML='';bank.forEach((e,i)=>{let b=document.createElement('button');b.className='test'+(localStorage.getItem('nafes_done_'+i)?' done':'');b.textContent='اختبار '+(i+1);b.onclick=()=>start(i);$('tests').append(b)})}function start(i){ei=i;qi=0;review=false;answers=Array(bank[i].questions.length).fill(-1);show('exam');render();tone()}function baseExplain(q,p){let a=q.options[q.correctIndex],s=q.skill||'';let lead='الإجابة الصحيحة: «'+a+'». ';if(s.includes('الشخصية'))return lead+'الشخصية الرئيسة هي من تدور حولها أحداث النص. ابحث عن الاسم الذي يتكرر أو يقوم بالأعمال الأساسية.';if(s.includes('المكان'))return lead+'نحدد المكان بالسؤال: أين وقعت الأحداث؟ ثم نعود إلى العبارة الدالة على الموقع في النص.';if(s.includes('ترتيب'))return lead+'نقرأ الأحداث بالترتيب الزمني ونبحث عن الحدث الذي بدأ به النص.';if(s.includes('الفكرة'))return lead+'الفكرة الرئيسة تلخص المعنى العام للنص، ولا تقتصر على تفصيل صغير.';if(s.includes('استنتاج'))return lead+'الاستنتاج معنى نفهمه من الأدلة والأحداث، حتى لو لم يُذكر بنفس الكلمات.';if(s.includes('مرادف')||s.includes('معاني'))return lead+'المرادف أو المعنى هو الكلمة أو العبارة الأقرب في المعنى بحسب سياق الجملة.';if(s.includes('مضاد'))return lead+'المضاد هو الكلمة التي تحمل المعنى العكسي للكلمة المطلوبة.';if(s.includes('السبب'))return lead+'اربط السبب بما حدث بعده: السبب يجيب عن لماذا، والنتيجة تجيب عن ماذا حدث.';if(s.includes('عنوان'))return lead+'العنوان المناسب يعبر عن الموضوع الأساسي للنص كله.';if(s.includes('إملائ'))return lead+'انتبه إلى شكل الحرف الأخير في الكلمة وميز التاء المربوطة (ة) من التاء المفتوحة (ت).';if(s.includes('نوع الكلمة'))return lead+'الفعل يدل على حدوث عمل في زمن، والاسم يدل على إنسان أو شيء أو معنى.';if(s.includes('المفرد'))return lead+'الجمع يدل على أكثر من اثنين؛ قارن بنية المفرد بصيغة الجمع الصحيحة.';if(s.includes('قيمة'))return lead+'القيمة هي السلوك الإيجابي الذي تدعونا إليه أحداث النص.';return lead+'اقرأ النص مرة أخرى وحدد العبارة التي تدعم الإجابة، ثم قارنها بالاختيارات.'}function explain(q,p){return baseExplain(q,p)+(q.evidence?" الدليل من النص: «"+q.evidence+"».":"")}function pict(q){let s=q.skill||'';return s.includes('المكان')?'📍':s.includes('الشخصية')?'👤':s.includes('الفكرة')?'💡':s.includes('مضاد')?'↔️':s.includes('مرادف')||s.includes('معاني')?'📚':s.includes('ترتيب')?'🔢':s.includes('إملائ')?'✍️':s.includes('السبب')?'🔗':s.includes('استنتاج')?'🔎':s.includes('قيمة')?'🌟':'📖'}
function renderPicture(q,p,visible){Teaching.render(q,p,visible)}
function render(){let e=bank[ei],q=e.questions[qi],p=e.passages[q.passageIndex]||e.passages[0];$('pt').textContent=p.title;$('pv').textContent=p.text;$('qt').textContent='السؤال '+(qi+1)+': '+q.text;$('count').textContent='السؤال '+(qi+1)+' من '+e.questions.length;$('opts').innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(answers[qi]===i?' sel':'')+(review&&i===q.correctIndex?' correct':review&&answers[qi]===i?' wrong':'');b.textContent=letters[i]+'- '+v;b.onclick=()=>choose(i);$('opts').append(b)});$('prev').disabled=qi===0;$('next').disabled=qi===e.questions.length-1;$('finish').classList.toggle('hidden',review);$('bubbles').innerHTML='';e.questions.forEach((_,j)=>{let row=document.createElement('div');row.className='brow'+(j===qi?' active':'');let n=document.createElement('span');n.textContent=j+1;row.append(n);letters.forEach((l,k)=>{let b=document.createElement('button');b.className='bubble'+(answers[j]===k?' sel':'');b.textContent=l;b.onclick=()=>{qi=j;if(!review){answers[j]=k;tone(k===e.questions[j].correctIndex)}render()};row.append(b)});$('bubbles').append(row)});let selected=answers[qi],visible=review||selected>=0;$('fbtitle').textContent=!visible?'التغذية الراجعة والشرح':review?'مراجعة السؤال':selected===q.correctIndex?'أحسنت! إجابة صحيحة':'إجابة غير صحيحة، تعلم من الشرح';$('fb').textContent=visible?explain(q,p):'اختر إجابة لتظهر لك التغذية الراجعة وشرح المهارة.';$('skill').textContent='المهارة: '+(q.skill||'فهم المقروء');$('art').textContent=pict(q);renderPicture(q,p,visible)}function choose(i){if(review)return;answers[qi]=i;tone(i===bank[ei].questions[qi].correctIndex);render()}$('prev').onclick=()=>{if(qi>0){qi--;tone();render()}};$('next').onclick=()=>{if(qi<bank[ei].questions.length-1){qi++;tone();render()}};$('finish').onclick=()=>{let missing=answers.indexOf(-1);if(missing>=0){qi=missing;render();alert('يرجى الإجابة عن السؤال '+(missing+1));return}let qs=bank[ei].questions,score=qs.filter((q,i)=>answers[i]===q.correctIndex).length;localStorage.setItem('nafes_done_'+ei,'1');$('score').textContent=score+' / '+qs.length;$('resultmsg').textContent=score/qs.length>=.8?'🌟 أداء رائع!':score/qs.length>=.6?'أداء جيد، واصل التقدم':'راجع الشرح وحاول مرة أخرى';show('result');tone(true)};$('review').onclick=()=>{review=true;qi=0;show('exam');render()};$('home').onclick=index;$('back').onclick=index;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 الصوت':'🔇 صامت'};index();
