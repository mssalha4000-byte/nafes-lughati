0 26px Amiri;margin:10px 0}.example{background:#fdf4e7;padding:15px 19px;border-radius:15px;border-right:5px solid #e3aa53;font:700 28px Amiri}.prompt{font:700 29px Amiri;line-height:1.8;text-align:center;padding:18px;background:#f6faf5;border-radius:15px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.answer{background:#fff;border:2px solid #bddbcf;border-radius:15px;padding:17px;font:700 25px Amiri;min-height:72px;color:#1c4c45}.answer:hover{background:#ebf7ed}.answer.correct{background:#d6f5de;border-color:#24ad65}.answer.wrong{background:#ffe1df;border-color:#ed7468}.feedback{min-height:43px;font-weight:800;font-size:19px;padding:10px;color:#235f51}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}.small{color:#53756b;font-size:15px}.footer{text-align:center;padding:25px;color:#5a756f}.score{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.field{font:700 25px Amiri;border:2px solid #bed8cd;border-radius:12px;padding:10px 15px;max-width:100%;text-align:center}.tiles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.tile{font:700 27px Amiri;background:#fff7e3;padding:18px 26px;border-radius:17px;border:2px dashed #dca658;cursor:pointer}.tile.selected{background:#d8f7e0;border-color:#3cad79}.progress{height:9px;background:#e2ede5;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#d8a34b;transition:width .3s}.video{display:block;text-decoration:none;color:var(--green);background:#f6fbf8;border:1px solid #cfe4d7;border-radius:17px;padding:22px;margin:10px 0;font-weight:800}.video span{font-size:32px;margin-left:12px}.badge{display:inline-block;background:#ffebbc;padding:7px 16px;border-radius:50px;margin:5px}.hide{display:none}.flower{font-size:55px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:580px;margin:auto}.board button{height:90px;border-radius:15px;font-size:32px;border:2px solid #c3dfcf;background:#e9f6eb}.board button.open{background:#fff7de}.range{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}.range>div{background:#ecf7ec;padding:16px;border-radius:18px}.muted{color:#64847b}a{color:#216e61}@media(max-width:700px){.garden{font-size:82px}.hero{padding:20px}.hero p{font-size:16px}.answer{font-size:23px}.board button{height:75px}.panel h2{font-size:29px}}
</style></head><body><header><div class="wrap top"><div class="brand">🌿 مغامرة لغتي — حديقتنا الجميلة</div><div class="score"><span class="pill">⭐ <span id="stars">0</span> نجمة</span><button class="secondary" onclick="toggleSound()" id="sound">🔊 الصوت يعمل</button><button class="secondary" onclick="share()">🔗 مشاركة الدرس</button></div></div></header><main class="wrap"><section class="hero"><div><span class="eyebrow">لغتي الجميلة · الصف الثالث الابتدائي · أخلاق المسلم</span><h1>معًا نجعل حديقتنا أجمل!</h1><p>نتعجب من جمال الطبيعة، ونحوّل الصور إلى كلمات، ونتعلم باللعب والتحديات.</p><br><button class="primary" onclick="go(1)">هيا نبدأ المغامرة ←</button></div><div class="garden" aria-hidden="true">🌳🌻</div></section><nav class="nav" id="tabs"></nav><section class="panel" id="panel"></section><div class="controls"><button class="secondary" id="prev" onclick="go(page-1)">→ السابق</button><span id="step" class="small"></span><button class="primary" id="next" onclick="go(page+1)">التالي ←</button></div></main><footer class="footer">إعداد المعلمة صالحة الغامدي<br>الطفولة المبكرة بالابتدائية السادسة والثلاثون – جدة</footer>
<script>
const names=['البداية','أتعلم التعجب','لعبة حديقة التعجب','أحوّل إلى علم','لعبة من المتحدث؟','أحوّل إلى أل','لعبة جمع الشتلات','ذاكرتي البصرية','فيديوهات وألعاب','التحدي الختامي'];
let page=0,stars=Number(localStorage.getItem('garden-stars')||0),soundOn=true,completed=JSON.parse(localStorage.getItem('garden-completed')||'{}'),quizIndex=0,quizPoints=0,chosen=[],memoryOpened=[],matched=[],memoryBusy=false;
const quiz=[['حديقة نظيفة. أكمل: ما ... الحديقة!',['أنظف','نظيف','نظافة'],0],['شتلات كثيرة.',['ما أكثر الشتلات!','ما كبيرة الشتلات!','ما شتلات كثيرة!'],0],['وردة زاهية.',['ما أزهى الوردة!','ما الوردة أزهى!','أزهى الوردة ما!'],0],['من الذي قال: في المدرسة ساحة واسعة؟',['فواز','المعلّم','حازم'],0],['من قال: الساحة واسعة ونحن صغار، فكيف يمكننا أن نزرعها؟',['حازم','فواز','المعلّم'],0],['حوّل صورة الشتلات إلى كلمة معرفة بأل.',['الشتلات','شتلات','شتلة'],0],['ما الكلمة المعرّفة بأل؟',['الماء','ماء','مياه'],0],['ما أحسن التعاون! هذا أسلوب...',['تعجب','استفهام','نداء'],0]];
function save(){localStorage.setItem('garden-stars',stars);localStorage.setItem('garden-completed',JSON.stringify(completed));document.getElementById('stars').textContent=stars}
function reward(id,n=2){if(!completed[id]){completed[id]=true;stars+=n;save()}}
function speak(t){if(!soundOn||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.92;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function toggleSound(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 الصوت يعمل':'🔇 الصوت مغلق'}
function share(){if(navigator.share)navigator.share({title:'حديقتنا الجميلة | لغتي ثالث',url:location.href});else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('تم نسخ الرابط'))}
function go(n){page=Math.max(0,Math.min(9,n));quizIndex=0;quizPoints=0;chosen=[];memoryOpened=[];matched=[];render();window.scrollTo({top:200,behavior:'smooth'})}
function tabs(){document.getElementById('tabs').innerHTML=names.map((x,i)=>'<button class="'+(i===page?'active':'')+'" onclick="go('+i+')">'+(i+1)+' · '+x+'</button>').join('')}
function content(t){document.getElementById('panel').innerHTML=t}
function render(){tabs();document.getElementById('step').textContent='المحطة '+(page+1)+' من 10';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===9;let h='';
if(page===0)h='<h2>أهلًا يا أبطال لغتي! 👋</h2><p class="lead">في درس اليوم سنكتشف كيف نُعَبِّر عن إعجابنا بما نرى، ونتعلم الفرق بين الاسم العَلَم والاسم المُعرّف بـ(أل)، ثم نلعب ونجمع النجوم.</p><div class="cards"><div class="item"><div class="emoji">🌷</div><h3>أسلوب التعجب</h3>ما أجمل الحديقة!</div><div class="item"><div class="emoji">👦</div><h3>الاسم العلم</h3>فواز · حازم</div><div class="item"><div class="emoji">🌱</div><h3>التعريف بـ(أل)</h3>الشتلات · الماء</div></div><p class="example">🎯 هدفنا: أعبر شفهيا، وأكمل الجمل، وأميز الكلمات.</p>';
if(page===1)h='<h2>🌼 أتعلم أسلوب التعجب</h2><p class="lead">عندما نرى شيئًا جميلًا ونعجب به، يمكننا أن نقول: <strong>ما أجمل ...!</strong> ونستخدم بعد «ما» فعلًا على وزن «أفعل».</p><div class="example">ما أَجْمَلَ الحَديقةَ!</div><div class="cards"><div class="item"><div class="emoji">🌳</div><h3>حديقة نظيفة</h3><b>ما أَنْظَفَ الحَديقةَ!</b></div><div class="item"><div class="emoji">🪴</div><h3>شتلات كثيرة</h3><b>ما أَكْثَرَ الشَّتَلاتِ!</b></div><div class="item"><div class="emoji">🌺</div><h3>وردة زاهية</h3><b>ما أَزْهَى الوَرْدَةَ!</b></div></div><p class="lead">🎙️ عبّر بصوتك عمّا يعجبك في الصف باستخدام: <b>ما أكثر!</b> أو <b>ما أحسن!</b></p><button class="secondary" onclick="speak('ما أجمل الحديقة! ما أنظف الحديقة! ما أكثر الشتلات! ما أزهى الوردة!')">🔊 استمع إلى الأمثلة</button>';
if(page===2){const q=[['🌳 حديقة نظيفة','أنظف','أكثر','أزهى'],['🪴 شتلات كثيرة','أكثر','أنظف','أحسن'],['🌺 وردة زاهية','أزهى','أكثر','أنظف']];const ix=Number(document.getElementById('panel').dataset.q||0);h='<h2>🎮 لعبة حديقة التعجب</h2><p>اختر الكلمة التي تكمل أسلوب التعجب، واجمع نجومك!</p><div class="prompt">'+q[ix][0]+'<br>ما .......... '+['الحديقةَ!','الشتلاتِ!','الوردةَ!'][ix]+'</div><div class="answers">'+q[ix].slice(1).map((v,i)=>'<button class="answer" onclick="chooseGarden('+ix+','+i+',this)">'+v+'</button>').join('')+'</div><div id="feedback" class="feedback"></div><div class="progress"><div style="width:'+((ix+1)/3*100)+'%"></div></div><button class="secondary" onclick="nextGarden()">السؤال التالي ⟵</button>'}
if(page===3)h='<h2>👦 أحوّل الصورة إلى علم</h2><p class="lead">الاسم العَلَم هو اسم يدل على شخص معيّن مثل: <strong>فواز، حازم</strong>.</p><div class="cards"><div class="item"><div class="emoji">👦🏻</div><h3>فَوَّاز</h3><p>قال فواز: في المدرسة ساحة واسعة، لم لا نزرعها لتصبح حديقة؟</p></div><div class="item"><div class="emoji">👦🏽</div><h3>حَازِم</h3><p>رد حازم: الساحة واسعة ونحن صغار، فكيف يمكننا أن نزرعها؟</p></div></div><div class="example">✨ بدلًا من صورة المتحدث، نكتب اسمَه العَلَم.</div>';
if(page===4){const i=Number(document.getElementById('panel').dataset.q||0);const qs=['في المدرسة ساحة واسعة، لم لا نزرعها لتصبح حديقة؟','الساحة واسعة ونحن صغار، فكيف يمكننا أن نزرعها؟'];h='<h2>🗣️ لعبة من المتحدث؟</h2><div class="prompt">«'+qs[i]+'»</div><div class="answers"><button class="answer" onclick="who(0,this)">👦🏻 فواز</button><button class="answer" onclick="who(1,this)">👦🏽 حازم</button></div><div id="feedback" class="feedback"></div><button class="secondary" onclick="nextWho()">السؤال التالي ⟵</button>'}
if(page===5)h='<h2>📖 أحوّل الصورة إلى اسم معرّف بـ(أل)</h2><p class="lead">عندما نضيف <strong>أل</strong> التعريف إلى بداية الاسم النكرة، تصبح الكلمة معرفة: <b>شتلات ← الشتلات</b>.</p><div class="cards"><div class="item"><div class="emoji">👨🏻‍🏫</div><h3>المعلّم</h3><p>قسّم المعلّم التلاميذ مجموعات.</p></div><div class="item"><div class="emoji">🪴</div><h3>الشتلات</h3><p>وثالثة تغرس الشتلات.</p></div><div class="item"><div class="emoji">💧</div><h3>الماء</h3><p>ورابعة تسقيها بالماء.</p></div></div><p class="example">نُطْق: الْمُعَلِّمُ — الشَّتَلاتُ — الْمَاءُ</p>';
if(page===6)h='<h2>🌱 لعبة جمع الشتلات</h2><p class="lead">ساعد مجموعة التلاميذ في اختيار الكلمات المعرفة بـ(أل). اختر <strong>الثلاث كلمات الصحيحة</strong> من الشتلات التالية.</p><div class="tiles">'+['المعلّم','شتلات','الماء','حازم','الشتلات','حديقة'].map(v=>'<button class="tile" onclick="plant(this)" data-v="'+v+'">🪴<br>'+v+'</button>').join('')+'</div><div id="feedback" class="feedback"></div><button class="secondary" onclick="checkPlant()">تحقق من الشتلات ✓</button>';
if(page===7)h='<h2>🧠 لعبة الذاكرة البصرية</h2><p>اقلب بطاقتين في كل مرة وابحث عن الصورة والكلمة المطابقة لها.</p><div class="board" id="board"></div><div id="feedback" class="feedback"></div>';
if(page===8)h='<h2>🎬 شاهد وتعلم ثم العب!</h2><p class="lead">الفيديوهات وروابط الألعاب التالية تفتح في نافذة جديدة؛ ابحث عن الشرح المناسب ثم عد إلى درسنا.</p><a class="video" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=أسلوب+التعجب+لغتي+ثالث+ابتدائي">▶️ شرح أسلوب التعجب للصف الثالث على يوتيوب</a><a class="video" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=النكرة+والمعرفة+بأل+الصف+الثالث+الابتدائي">▶️ شرح النكرة والمعرفة بـ(أل)</a><a class="video" target="_blank" rel="noopener" href="https://wordwall.net/ar-sa/community/أسلوب-التعجب">🎲 ألعاب أسلوب التعجب في Wordwall</a><a class="video" target="_blank" rel="noopener" href="https://wordwall.net/ar-sa/community/النكرة-والمعرفة">🎯 ألعاب المعرفة والنكرة في Wordwall</a><p class="small">هذه روابط إلى صفحات بحث وألعاب خارجية، وليست فيديوهات محددة تمت مراجعتها؛ يمكن للمعلمة اختيار المقطع المناسب قبل عرضه.</p>';
if(page===9)h='<h2>🏆 التحدي الختامي</h2><p>أجب عن 8 أسئلة متنوعة لتعرف مدى إتقانك، ثم احصل على شهادة تشجيع!</p><div id="quiz"></div>';
content(h);if(page===2||page===4)document.getElementById('panel').dataset.q=0;if(page===7)drawMemory();if(page===9)drawQuiz();}
function chooseGarden(ix,i,el){const correct=i===0;el.classList.add(correct?'correct':'wrong');document.getElementById('feedback').textContent=correct?'⭐ رائع يا بطل! إجابتك صحيحة.':'حاول مرة أخرى يا بطل!';if(correct){reward('garden'+ix,2);speak('أحسنت يا بطل')}else speak('حاول مرة أخرى')}
function nextGarden(){const d=document.getElementById('panel');const i=Number(d.dataset.q||0);if(i===2){go(3);return}d.dataset.q=i+1;const q=[['🌳 حديقة نظيفة','أنظف','أكثر','أزهى'],['🪴 شتلات كثيرة','أكثر','أنظف','أحسن'],['🌺 وردة زاهية','أزهى','أكثر','أنظف']];d.innerHTML='<h2>🎮 لعبة حديقة التعجب</h2><div class="prompt">'+q[i+1][0]+'<br>ما .......... '+['الحديقةَ!','الشتلاتِ!','الوردةَ!'][i+1]+'</div><div class="answers">'+q[i+1].slice(1).map((v,k)=>'<button class="answer" onclick="chooseGarden('+(i+1)+','+k+',this)">'+v+'</button>').join('')+'</div><div id="feedback" class="feedback"></div><button class="secondary" onclick="nextGarden()">السؤال التالي ⟵</button>'}
function who(i,el){let ix=Number(document.getElementById('panel').dataset.q||0),ok=ix===i;el.classList.add(ok?'correct':'wrong');document.getElementById('feedback').textContent=ok?'⭐ أحسنت! هذا هو المتحدث.':'جرّب المتحدث الآخر';if(ok){reward('who'+ix);speak('ممتاز يا بطل')}}
function nextWho(){let i=Number(document.getElementById('panel').dataset.q||0);if(i===1){go(5);return}let d=document.getElementById('panel');d.dataset.q=1;d.innerHTML='<h2>🗣️ لعبة من المتحدث؟</h2><div class="prompt">«الساحة واسعة ونحن صغار، فكيف يمكننا أن نزرعها؟»</div><div class="answers"><button class="answer" onclick="who(0,this)">👦🏻 فواز</button><button class="answer" onclick="who(1,this)">👦🏽 حازم</button></div><div id="feedback" class="feedback"></div><button class="secondary" onclick="nextWho()">التالي ⟵</button>'}
function plant(el){el.classList.toggle('selected');if(el.classList.contains('selected'))chosen.push(el.dataset.v);else chosen=chosen.filter(x=>x!==el.dataset.v)}
function checkPlant(){const ok=['المعلّم','الماء','الشتلات'];let valid=chosen.length===3&&chosen.every(x=>ok.includes(x));document.getElementById('feedback').textContent=valid?'🌟 زرعت ثلاث شتلات صحيحة! يا لك من قارئ ماهر.':'اختر ثلاث كلمات تبدأ بـ«أل» التعريف، ثم تحقق مجددًا.';if(valid){reward('plant',5);speak('رائع يا بطل')}}
const faces=['🌳','🌷','💧','الشجرة','الوردة','الماء'];let shuffled=[];
function drawMemory(){shuffled=[0,3,1,4,2,5].sort(()=>Math.random()-.5);document.getElementById('board').innerHTML=shuffled.map((v,i)=>'<button id="mem'+i+'" onclick="flip('+i+')">❔</button>').join('');document.getElementById('feedback').textContent='اعثر على ثلاث مجموعات متطابقة'}
function flip(i){if(memoryBusy||matched.includes(i)||memoryOpened.includes(i)||memoryOpened.length===2)return;memoryOpened.push(i);let el=document.getElementById('mem'+i);el.textContent=faces[shuffled[i]];el.classList.add('open');if(memoryOpened.length===2){let [a,b]=memoryOpened;let ok=(shuffled[a]%3)===(shuffled[b]%3)&&shuffled[a]!==shuffled[b];if(ok){matched.push(a,b);memoryOpened=[];reward('memory'+matched.length,2);document.getElementById('feedback').textContent='أحسنت! زوج متطابق ⭐';if(matched.length===6){reward('memorycomplete',4);document.getElementById('feedback').textContent='🏆 أتممت لعبة الذاكرة!'}}else{memoryBusy=true;setTimeout(()=>{for(const j of [a,b]){document.getElementById('mem'+j).textContent='❔';document.getElementById('mem'+j).classList.remove('open')}memoryOpened=[];memoryBusy=false},850)}}}
function drawQuiz(){let e=document.getElementById('quiz');if(quizIndex>=quiz.length){e.innerHTML='<div class="item"><div class="flower">🏆</div><h2>مبارك إتمام الدرس!</h2><p class="lead">حصلت على '+quizPoints+' من '+quiz.length+' إجابات صحيحة.</p><p class="example">أنت بطل لغتي! ⭐</p><button class="secondary" onclick="quizIndex=0;quizPoints=0;drawQuiz()">إعادة التحدي</button> <button class="primary" onclick="window.print()">🖨️ طباعة صفحة النتيجة</button></div>';reward('end',5);return}let q=quiz[quizIndex],arr=q[1].map((s,i)=>({s,i})).sort(()=>Math.random()-.5);e.innerHTML='<p class="muted">السؤال '+(quizIndex+1)+' من '+quiz.length+'</p><div class="progress"><div style="width:'+(quizIndex/quiz.length*100)+'%"></div></div><div class="prompt">'+q[0]+'</div><div class="answers">'+arr.map(o=>'<button class="answer" onclick="answerQuiz('+o.i+',this)">'+o.s+'</button>').join('')+'</div><div id="feedback" class="feedback"></div>'}
function answerQuiz(i,el){const good=i===quiz[quizIndex][2];el.classList.add(good?'correct':'wrong');if(good){quizPoints++;reward('quiz'+quizIndex,2);speak('صحيح! أحسنت')}else speak('إجابة غير صحيحة');document.getElementById('feedback').textContent=good?'⭐ إجابة صحيحة!':'الإجابة الصحيحة: '+quiz[quizIndex][1][quiz[quizIndex][2]];document.querySelectorAll('#quiz .answer').forEach(b=>b.disabled=true);setTimeout(()=>{quizIndex++;drawQuiz()},1250)}
save();render();
</script></body></html>
