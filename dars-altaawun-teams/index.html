*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#e7f0e7;font-family:'Tajawal',Tahoma,Arial,sans-serif;color:var(--ink);background-image:radial-gradient(#bdd7c7 1px,transparent 1px);background-size:26px 26px}button,a{font-family:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #e69d37;outline-offset:3px}a{color:inherit;text-decoration:none}

#fff;border:2px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:0 6px 18px #34714c0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);min-height:130px;font-size:clamp(18px,2.2vw,30px);font-weight:900;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 20px #285c371e}.card small{font-size:clamp(13px,1.3vw,19px);color:#728c7d;font-weight:600}.card .emoji{font-size:clamp(37px,4.8vw,66px)}.box{background:#fff;border:2px solid #c9e2d2;border-radius:28px;padding:clamp(16px,3vw,35px);font-size:clamp(26px,3.7vw,55px);font-weight:800;line-height:1.65;margin:16px auto;max-width:1100px;box-shadow:0 7px 15px #1e49340c}.box .blank{display:inline-block;min-width:150px;border-bottom:4px dotted #e59a7b;color:#db7553}.btn{background:var(--forest);color:#fff;border:0;border-radius:18px;padding:16px 31px;font-weight:900;font-size:clamp(20px,2.35vw,31px);box-shadow:0 7px 0 #164b39;transition:transform .12s;margin:8px}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #164b39}.btn.light{background:#f2b850;color:#633c12;box-shadow:0 7px 0 #b57c1d}.btn.outline{background:white;color:var(--forest);border:2px solid #b9dacf;box-shadow:0 4px 0 #bad4c4}.reveal{background:#e8f7e6;border:3px dashed #8dc39f;border-radius:25px;padding:20px;margin:20px auto;max-width:850px;font-weight:900;font-size:clamp(24px,3.6vw,51px);color:#17714d;animation:rise .3s ease}.bad{background:#ffe8e3;border:2px solid #e3b2a8;color:#a14134}.good{background:#def4df;border:2px solid #92cba0;color:#176947}.msg{margin:16px auto;padding:13px 22px;border-radius:17px;max-width:750px;font-size:clamp(18px,2.3vw,30px);font-weight:800}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin:20px auto;max-width:1100px}.answer{border:3px solid #bdd9c5;background:#fff;color:var(--ink);border-radius:23px;min-height:105px;padding:16px;font-size:clamp(21px,2.7vw,37px);font-weight:900}.answer:hover{background:#f3faed}.answer.right{border-color:#46a679;background:#d9f1dc;color:#156444}.answer.wrong{border-color:#e68c7d;background:#ffe5de;color:#9f3b33}.team.active{background:#115945;color:white;border-color:#115945}.team.blue.active{background:#296a97;border-color:#296a97}.scoreboard{justify-content:center;margin:10px auto}.scoreboard .team{font-size:17px}.scorecount{padding:7px 14px;background:#fff6d8;border-radius:999px;color:#9b651b;font-size:18px;font-weight:900}.wheel{width:min(45vw,330px);height:min(45vw,330px);margin:12px auto;border:12px solid #fff6db;border-radius:50%;background:conic-gradient(#ffa985 0deg 60deg,#b0deba 60deg 120deg,#ffe48c 120deg 180deg,#a9d6d2 180deg 240deg,#f7beb0 240deg 300deg,#b2cf95 300deg 360deg);display:grid;place-items:center;box-shadow:0 8px 15px #17473534;transition:transform 1s cubic-bezier(.18,.82,.25,1)}.wheel span{font-size:clamp(60px,10vw,100px)}.wheel.spin{transform:rotate(1060deg)}.linkrow{display:flex;align-items:center;justify-content:space-between;gap:15px;border:2px solid #d2e2d7;background:#fff;border-radius:20px;padding:12px 18px;margin:12px auto;text-align:right;max-width:950px}.linkrow strong{font-size:clamp(17px,2vw,27px);color:var(--forest)}.linkrow p{font-size:clamp(14px,1.55vw,20px);margin:5px 0;color:#547969}.linkrow a{border:0;border-radius:13px;background:var(--forest);color:#fff;font-size:18px;font-weight:800;padding:12px 16px;white-space:nowrap}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:18px 5px 0;font-size:15px;font-weight:800;color:#56806b}.nav{justify-content:center}.nav button{font-size:19px}.progress{height:9px;background:#dcebe0;border-radius:12px;overflow:hidden;margin:0 0 9px}.progress span{display:block;background:#4aa480;height:100%;transition:width .2s}.countdown{font-size:clamp(52px,9vw,130px);font-weight:900;color:var(--forest)}.inline{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.pill{border-radius:99px;background:#e1f3e8;padding:8px 17px;color:#256f53;font-weight:800;font-size:clamp(18px,2vw,28px)}.credits{color:#6b8b78;font-size:15px;font-weight:700}.options{margin:auto;max-width:700px}.step{font-size:clamp(19px,2vw,27px);font-weight:800;color:#347760}.source{font-size:12px;color:#658e7a;text-align:center}.match{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:970px;margin:20px auto}.match button{background:#fff;border:3px solid #bad8c5;border-radius:20px;padding:17px;font-size:clamp(20px,2.5vw,34px);font-weight:800}.match button.picked{background:#fff0d1;border-color:#e6aa51}.match button.solved{background:#e4f5df;border-color:#51a77a;opacity:.8}.boxspin{animation:rise .3s}.small{font-size:clamp(18px,2vw,27px)}.muted{color:#69887a}.miniHead{color:#246f58;font-size:clamp(20px,3vw,42px);font-weight:900}.flex{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.flex button{flex:1;min-width:160px}.hot{font-size:50px}.starWrap{font-size:45px;color:#f3b544}.group-score{font-size:clamp(24px,3.5vw,50px);color:#195f45;font-weight:900}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){#app{padding:8px}.stage{padding:18px 12px;border-radius:17px;min-height:68vh}.content{width:100%}.cardgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:12px;min-height:120px}.card .emoji{font-size:35px}.answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.answer{min-height:75px}.linkrow{flex-direction:column;text-align:center}.team{padding:8px 9px!important;font-size:14px!important}.footer{justify-content:center}.brand{font-size:18px}.tools button{padding:8px}}

<body><div id="app">
<header><div><div class="brand">🌷 حديقة لغتي التفاعلية</div><div class="subbrand">الصف الثالث الابتدائي • درس التعاون • عرض مباشر عبر تيمز</div></div><div class="tools"><button id="sound" aria-label="التشجيع الصوتي">🔈 تشغيل التشجيع</button><button id="fullscreen">⛶ ملء الشاشة</button></div></header>
<div class="progress"><span id="progress" style="width:0%"></span></div><main id="stage" class="stage" role="region" aria-label="شرائح الدرس"><div class="content" id="content"></div></main>
<footer class="footer"><div class="credits">إعداد المعلمة صالحة الغامدي • الطفولة المبكرة بالابتدائية السادسة والثلاثون – جدة</div><div class="nav"><button id="home">⌂ الفهرس</button><button id="prev">السابق ❮</button><span id="slidecount">١ / ٢٢</span><button id="next">❯ التالي</button></div></footer>
</div>
<script>
(function(){
'use strict';
const slides=['البداية','خريطة الدرس','تهيئة','أهداف الدرس','جمال التعاون','التعجب','حديقة نظيفة','شتلات كثيرة','وردة زاهية','اختر الإجابة','عجلة الحظ','تحويل إلى علم','من القائل؟','التعريف بأل','المطابقة','صناديق المفاجآت','ترتيب الجملة','سباق الزمن','التحدي الختامي','فيديوهات','روابط الألعاب','تذكرة الخروج'];
const WHEEL=[['🌿','حديقة نظيفة','ما أنظفَ الحديقةَ!'],['🌱','شتلات كثيرة','ما أكثرَ الشتلاتِ!'],['🌺','وردة زاهية','ما أزهى الوردةَ!'],['📚','كتب كثيرة','ما أكثرَ الكتبَ!'],['🧹','صف مرتب','ما أحسنَ ترتيبَ الصفِّ!'],['🤝','التعاون','ما أجملَ التعاونَ!']];
const Q=[['أي جملة تدل على التعجب؟',['الحديقة نظيفة.','ما أجملَ الحديقةَ!','أين الحديقة؟'],1],['ما المعرفة من «شتلات»؟',['الشتلات','شتلات','شتلة'],0],['ما اسم العَلَم في الجملة؟',['المدرسة','فواز','الساحة'],1],['ما الذي تضيفه إلى «المعلم» لتحصل عليها من «معلم»؟',['ياء','أل','واو'],1],['اختر التعبير الصحيح عن الوردة الزاهية.',['ما أزهى الوردةَ!','ما أطولَ الشجرةَ!','الوردة في الحديقة.'],0]];
const MAP=[{icon:'👋',a:'تهيئة الحصة',b:'نقرأ ونتحدث',n:2},{icon:'🌺',a:'أستخدم',b:'أسلوب التعجب',n:5},{icon:'🎡',a:'عجلة الحظ',b:'تحديات التعجب',n:10},{icon:'🧒',a:'أحوّل إلى عَلَم',b:'من القائل؟',n:11},{icon:'🌱',a:'المعرفة بأل',b:'نكرة ومعرفة',n:13},{icon:'🎁',a:'لعبة المطابقة',b:'وصناديق المفاجآت',n:14},{icon:'🏆',a:'سباق وتحدٍّ',b:'مراجعة ختامية',n:17},{icon:'🎬',a:'الفيديوهات والألعاب',b:'مصادر تعليمية',n:19}];
const videoLinks=[
 ['🎥','شرح «أحوّل إلى عَلَم»','فيديو قصير مرتبط بدرس التعاون','https://sahl.io/sa/lecture/46175/ثالث-ابتدائي/لغتي-الفصل-الاول/بمحاكاة-المثال-الأول-أحول-الصور-الى-علم?teacher=66748'],
 ['🎞️','شرح مجموعة المعلم والشتلات','شرح قراءة ومهارات الدرس','https://www.sahl.io/sa/lecture/46154/ثالث-ابتدائي/لغتي/قسم-المعلم-التلاميذ-مجموعات?teacher=621796'],
 ['📖','شرح درس التعاون كاملاً','الدرس مع أكثر من شرح مصوّر','https://sahl.io/sa/lesson/8470/ثالث-ابتدائي/لغتي/الدرس-الأول-التعاون']
];
const gameLinks=[
 ['🎮','لعبة التعاون','مسابقة تفاعلية عن القصة','https://hessaplay.com/lessons/sa3a-3-1'],
 ['🏅','التعجب والمعرفة والنكرة','١٥ سؤالاً تفاعليًا للمراجعة','https://www.hessaplay.com/lessons/sa3a-3-3']
];
const state={n:0,show:false,sel:-1,points:[0,0],team:0,sound:false,done:{},wheel:0,spin:false,box:-1,match:[],picked:-1,words:[],wordOrder:[],timer:30,running:false,final:0,finalAnswers:{},win:false};
try{const x=localStorage.getItem('garden-teams-2026');if(x){const y=JSON.parse(x);if(Array.isArray(y.points)&&y.points.length===2)state.points=y.points;}}catch(e){}
const $=id=>document.getElementById(id);
function say(s){if(!state.sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(s);a.lang='ar-SA';a.rate=.88;speechSynthesis.speak(a);}catch(e){}}
function keep(){try{localStorage.setItem('garden-teams-2026',JSON.stringify({points:state.points}));}catch(e){}}
function star(v=1){state.points[state.team]+=v;keep();say('أحسنت يا بطل!');render();}
function goto(n){state.n=Math.max(0,Math.min(slides.length-1,n));state.show=false;state.sel=-1;state.picked=-1;state.wordOrder=[];state.running=false;render();}
function heading(tag,title,sub=''){return '<div class="meta">'+tag+'</div><h1 class="title">'+title+'</h1>'+(sub?'<p class="lead">'+sub+'</p>':'');}
function button(label,call,variant=''){return '<button class="btn '+variant+'" onclick="'+call+'">'+label+'</button>';}
function box(text){return '<div class="box">'+text+'</div>';}
function reveal(text){return button(state.show?'🙈 إخفاء الإجابة':'✨ اكشفي الإجابة','garden.reveal()')+(state.show?'<div class="reveal">'+text+'</div>':'');}
function score(){return '<div class="scoreboard"><button class="team '+(state.team===0?'active':'')+'" onclick="garden.team(0)">🌿 فريق الأبطال '+state.points[0]+' ⭐</button><button class="team blue '+(state.team===1?'active':'')+'" onclick="garden.team(1)">💧 فريق المبدعين '+state.points[1]+' ⭐</button><button class="team" onclick="garden.star()">➕ نجمة للفريق</button></div>';}
function choices(q,opts,c,key){return '<div class="lead">'+q+'</div><div class="answers">'+opts.map((opt,i)=>'<button class="answer '+(state.sel===i?(i===c?'right':'wrong'):'')+'" onclick="garden.answer('+i+','+c+',&quot;'+key+'&quot;)">'+opt+'</button>').join('')+'</div>'+(state.sel>=0?'<div class="msg '+(state.sel===c?'good':'bad')+'">'+(state.sel===c?'⭐ إجابة صحيحة يا بطل!':'🌱 حاول مرة أخرى')+'</div>':'');}
function menu(){return heading('الفهرس التفاعلي','🌸 محطات رحلتنا','اختاري المحطة التي تناسب وقت الحصة')+'<div class="cardgrid">'+MAP.map(m=>'<button class="card" onclick="garden.goto('+m.n+')"><span class="emoji">'+m.icon+'</span>'+m.a+'<small>'+m.b+'</small></button>').join('')+'</div>';}
function draw(){
const s=state.n;let h='';
switch(s){
case 0:h='<div class="art">🌳🌷</div>'+heading('أخلاق المسلم • الدرس الأول','رحلة في <em>حديقة لغتي</em>','نتعلّم ونتعاون ونلعب معًا في حصتنا المباشرة!')+button('🌟 ابدئي الرحلة','garden.goto(1)')+'<p class="hint">أنشطة تفاعلية للعرض عبر Microsoft Teams</p>';break;
case 1:h=menu();break;
case 2:h=heading('هيا نبدأ','👀 انظر وتأمل','كيف تحوّلت ساحة المدرسة إلى حديقة جميلة؟')+'<div class="art">🏫 🤝 🌳</div>'+box('ماذا يحدث عندما يتعاون الأصدقاء؟')+reveal('ننجز الأعمال بسرعة، ويصبح المكان أجمل!');break;
case 3:h=heading('أهداف الدرس','🎯 ماذا سنتعلم اليوم؟')+'<div class="cardgrid"><div class="card"><span class="emoji">🌺</span>أتعجب من المشاهد</div><div class="card"><span class="emoji">👦</span>أحوّل الصورة إلى عَلَم</div><div class="card"><span class="emoji">🌿</span>أحوّل النكرة إلى معرفة بـ(أل)</div><div class="card"><span class="emoji">🎮</span>أطبّق مهاراتي باللعب</div></div>';break;
case 4:h=heading('من درس التعاون','🤝 بالتعاون نصنع الجمال')+'<div class="art">👦👧🌷🌿</div>'+box('تعاون التلاميذ في تنظيف الساحة وحفر الحفر وغرس الشتلات وسقيها.')+reveal('أعجب فواز بالحديقة فقال: «ما أجملَ الحديقةَ!»');break;
case 5:h=heading('أستخدم','✨ أسلوب التعجب','أعبّر عن إعجابي بشيء بطريقة جميلة.')+box('ما <span style="color:#e17d55">أجملَ</span> الحديقةَ!')+'<p class="step">نبدأ بـ «ما»، ثم نعبّر عن الشيء الذي أعجبنا.</p>'+reveal('مثال آخر: ما أحسنَ التعاونَ!');break;
case 6:h=heading('شاهد وتعجب','🌳 حديقة نظيفة')+'<div class="art">🌳🧹🌼</div>'+box('ما <span class="blank">...........</span> الحديقةَ!')+reveal('ما أنظفَ الحديقةَ!');break;
case 7:h=heading('شاهد وتعجب','🪴 شتلات كثيرة')+'<div class="art">🪴🪴🪴</div>'+box('ما <span class="blank">...........</span> الشتلاتِ!')+reveal('ما أكثرَ الشتلاتِ!');break;
case 8:h=heading('شاهد وتعجب','🌺 وردة زاهية')+'<div class="art">🌺🌸</div>'+box('ما <span class="blank">...........</span> الوردةَ!')+reveal('ما أزهى الوردةَ!');break;
case 9:h=heading('اختر الإجابة','🎯 اختر أسلوب التعجب المناسب')+score()+choices('حديقة جميلة، ماذا أقول؟',['ما أجملَ الحديقةَ!','في المدرسة حديقةٌ.','مَن نظّف الحديقة؟'],0,'s9');break;
case 10:h=heading('لعبة عجلة الحظ','🎡 تحدي التعجب')+score()+'<div class="wheel '+(state.spin?'spin':'')+'"><span>🌼</span></div>'+button('🎡 دوّري العجلة','garden.spin()','light')+(state.show?'<div class="reveal">'+WHEEL[state.wheel][0]+' '+WHEEL[state.wheel][1]+'<div class="small">ما جملة التعجب المناسبة؟</div>'+WHEEL[state.wheel][2]+'</div>':'<p class="hint">عند الضغط، يظهر تحدٍّ عشوائي. يمكن إعطاء نجمة للفريق.</p>');break;
case 11:h=heading('أحوّل','🧒 من الصورة إلى العَلَم','العَلَم هو اسم لشخص معيّن.')+box('قال <span style="color:#e78a5f">فواز</span>: في المدرسة ساحة واسعة، لمَ لا نزرعها؟')+reveal('الاسم العَلَم: فواز');break;
case 12:h=heading('أحوّل إلى عَلَم','🗣️ مَن القائل؟')+score()+choices('ردّ: «الساحة واسعة ونحن صغار، فكيف يمكننا أن نزرعها؟»',['فواز','حازم','المعلم'],1,'s12');break;
case 13:h=heading('أحوّل النكرة إلى معرفة','🌱 أضيف «أل» إلى الكلمة')+box('مُعَلِّمٌ  ←  <span style="color:#e78a5f">الْمُعَلِّمُ</span>')+'<div class="cardgrid"><div class="card">مجموعاتٌ  ⟵  المجموعاتُ</div><div class="card">شتلاتٌ  ⟵  الشتلاتُ</div><div class="card">ماءٌ  ⟵  الماءُ</div></div>'+reveal('النكرة: شيء غير معيّن. المعرفة بـ(أل): شيء معيّن.');break;
case 14:
const pairs=[['شتلات','الشتلات'],['حديقة','الحديقة'],['معلّم','المعلّم'],['ماء','الماء']];
h=heading('لعبة المطابقة','🔗 صِل النكرة بالمعرفة')+score()+'<p class="hint">اضغطي على الكلمة اليمنى ثم المعرفة المطابقة لها يسارًا.</p><div class="match"><div>'+pairs.map((p,i)=>'<button class="'+(state.match.includes(i)?'solved':'')+' '+(state.picked===i?'picked':'')+'" onclick="garden.pick('+i+')">'+p[0]+'</button>').join('<div style="height:9px"></div>')+'</div><div>'+[2,0,3,1].map((x)=>'<button class="'+(state.match.includes(x)?'solved':'')+'" onclick="garden.match('+x+')">'+pairs[x][1]+'</button>').join('<div style="height:9px"></div>')+'</div></div><p class="hint">المطابقات الصحيحة: '+state.match.length+' / ٤</p>';break;
case 15:h=heading('لعبة صناديق المفاجآت','🎁 اختر صندوقًا')+score()+'<div class="cardgrid">'+['📦','🎁','🧰','🎀'].map((e,i)=>'<button class="card" onclick="garden.box('+i+')"><span class="emoji">'+e+'</span>الصندوق '+(i+1)+'</button>').join('')+'</div>'+(state.box>=0?'<div class="reveal">'+[['ما أجمل الحديقة!','ما نوع الأسلوب؟ «تعجب»'],['أكمل: ما ... الشتلات!','أكثرَ'],['حوّل نكرة «ساحة» إلى معرفة','الساحة'],['ما اسم العَلَم في القصة؟','فواز أو حازم']][state.box][0]+'<div class="small" style="margin-top:10px">'+(state.show?['ما نوع الأسلوب؟ «تعجب»','ما أكثرَ الشتلاتِ!','الساحة','فواز أو حازم'][state.box]:'فكّر ثم اكشف الإجابة')+'</div></div>':'')+(state.box>=0?button(state.show?'🙈 إخفاء':'✨ كشف الإجابة','garden.reveal()'):'');break;
case 16:
const order=['ما','أجملَ','الحديقةَ','!'];
h=heading('لعبة ترتيب الكلمات','🧩 رتّب جملة التعجب')+'<p class="lead">اضغط الكلمات بالترتيب لتكوين الجملة.</p>'+box(state.wordOrder.length?state.wordOrder.map(i=>order[i]).join(' '):'اضغط الكلمات بالترتيب هنا')+'<div class="answers">'+[2,0,3,1].map(i=>'<button class="answer" '+(state.wordOrder.includes(i)?'disabled style="opacity:.35"':'')+' onclick="garden.word('+i+')">'+order[i]+'</button>').join('')+'</div>'+button('🔄 إعادة المحاولة','garden.wordsReset()','outline')+(state.wordOrder.length===4?'<div class="msg '+(state.wordOrder.join(',')==='0,1,2,3'?'good':'bad')+'">'+(state.wordOrder.join(',')==='0,1,2,3'?'✨ رائع، ترتيب صحيح!':'حاول مرة أخرى')+'</div>':'');break;
case 17:h=heading('تحدّي الفريقين','⏳ سباق الثلاثين ثانية')+score()+'<div class="countdown">'+state.timer+' <span class="small">ثانية</span></div><p class="lead">كم جملة تعجب يستطيع فريقك أن يقول خلال الوقت؟</p>'+button(state.running?'⏸️ إيقاف':'▶️ ابدئي المؤقت','garden.timer()')+button('🔄 إعادة ٣٠ ثانية','garden.timerReset()','outline')+'<div class="hint">الفريق الفائز هو الأكثر إبداعًا وصحة في الجمل.</div>';break;
case 18:
const f=Q[state.final];
h=heading('التحدّي الختامي','🏆 حصاد النجوم','السؤال '+(state.final+1)+' من '+Q.length)+score()+choices(f[0],f[1],f[2],'final'+state.final)+'<div class="inline">'+button('◀ السؤال السابق','garden.finalPrev()','outline')+button('السؤال التالي ▶','garden.finalNext()','light')+'</div>';break;
case 19:h=heading('ركن الفيديوهات','🎬 تعلّم بالمشاهدة','اضغطي «فتح الفيديو» لمشاركته مع الطلاب في تيمز.')+videoLinks.map(v=>'<div class="linkrow"><div><strong>'+v[0]+' '+v[1]+'</strong><p>'+v[2]+'</p></div><a target="_blank" rel="noopener noreferrer" href="'+v[3]+'">▶ فتح الفيديو ↗</a></div>').join('')+'<p class="hint">فعّلي مشاركة صوت الكمبيوتر في تيمز عند عرض الفيديو.</p>';break;
case 20:h=heading('ألعاب إضافية','🎮 روابط ألعاب جاهزة','تفتح الألعاب في علامة تبويب جديدة.')+gameLinks.map(v=>'<div class="linkrow"><div><strong>'+v[0]+' '+v[1]+'</strong><p>'+v[2]+'</p></div><a target="_blank" rel="noopener noreferrer" href="'+v[3]+'">ابدئي اللعب ↗</a></div>').join('')+'<p class="hint">الألعاب داخل هذا العرض تعمل دون الانتقال إلى موقع خارجي.</p>';break;
case 21:h=heading('تذكرة الخروج','🌟 قبل أن نودّع الحديقة')+'<div class="cardgrid"><button class="card" onclick="garden.reveal()">🌺 قل جملة تعجّب</button><button class="card" onclick="garden.reveal()">🧒 اذكر اسم عَلَم</button><button class="card" onclick="garden.reveal()">🌱 حوّل «وردة» إلى معرفة</button></div>'+(state.show?'<div class="reveal">ما أجملَ الحديقةَ! • فواز • الوردة</div>':'')+'<div class="group-score">🌿 '+state.points[0]+' نجوم &nbsp; | &nbsp; 💧 '+state.points[1]+' نجوم</div><p class="lead">شكرًا يا أبطال، بالتعاون نصنع النجاح! 🌷</p>'+button('🌼 العودة إلى البداية','garden.goto(0)');break;
}
$('content').innerHTML=h;
$('progress').style.width=((s+1)/slides.length*100)+'%';
$('slidecount').textContent=(s+1)+' / '+slides.length;
$('prev').disabled=s===0;
$('next').disabled=s===slides.length-1;
}
function answer(i,c,key){state.sel=i;if(i===c&&!state.done[key]){state.done[key]=true;star();}else{if(i===c)say('إجابة صحيحة!');draw();}}
const api={goto,team(i){state.team=i;draw()},star,answer,reveal(){state.show=!state.show;draw()},pick(i){state.picked=i;draw()},match(i){if(state.picked===i&&!state.match.includes(i)){state.match.push(i);state.picked=-1;star();}else{state.picked=-1;say('حاول مجددًا')};draw()},box(i){state.box=i;state.show=false;draw()},word(i){if(state.wordOrder.includes(i))return;state.wordOrder.push(i);if(state.wordOrder.length===4&&state.wordOrder.join(',')==='0,1,2,3'&&!state.done.words){state.done.words=true;star()};draw()},wordsReset(){state.wordOrder=[];draw()},spin(){if(state.spin)return;state.wheel=Math.floor(Math.random()*WHEEL.length);state.spin=true;state.show=false;draw();setTimeout(()=>{state.spin=false;state.show=true;draw();},1050)},timer(){state.running=!state.running;draw()},timerReset(){state.timer=30;state.running=false;draw()},finalNext(){state.final=Math.min(Q.length-1,state.final+1);state.sel=-1;draw()},finalPrev(){state.final=Math.max(0,state.final-1);state.sel=-1;draw()}};
window.garden=api;
$('home').onclick=()=>goto(1);$('next').onclick=()=>goto(state.n+1);$('prev').onclick=()=>goto(state.n-1);
$('sound').onclick=function(){state.sound=!state.sound;this.textContent=state.sound?'🔊 إيقاف التشجيع':'🔈 تشغيل التشجيع';if(state.sound)say('مرحبًا يا أبطال لغتي!')};
$('fullscreen').onclick=function(){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen();else if(document.fullscreenElement)document.exitFullscreen()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();goto(state.n+1)}if(e.key==='ArrowRight'){e.preventDefault();goto(state.n-1)}});
setInterval(()=>{if(state.running&&state.timer>0){state.timer--;if(!state.timer){state.running=false;say('انتهى الوقت!')};if(state.n===17)draw()}},1000);
draw();
})();
</script></body></html>
